<style>

function loadSave() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { ...START, inventory: {...START.inventory} };
    const old = JSON.parse(raw);
    return { ...START, ...old,
      inventory: { ...START.inventory, ...(old.inventory || {}) },
      achievements: old.achievements || {},
      ownedChars: old.ownedChars || ['default']
    };
  } catch(_) { return { ...START, inventory: {...START.inventory} }; }
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    if (currentUser && window.FB && window.FB.ready) {
      const ref = window.FB.doc(window.FB.db, 'route66_users', currentUser.uid);
      const data = { ...state, email: currentUser.email, lastSeen: Date.now(), friendsCount: friends.length };
      window.FB.setDoc(ref, data, { merge: true }).catch(() => {});
    }
  } catch(_) {}
}

function playSound(kind) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    if (audio.state === 'suspended') audio.resume();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    let base = 280, target = 1.12, type = "sine";
    if (kind === "coin") { base = 680; target = 1.55; }
    else if (kind === "upgrade") { base = 430; target = 1.4; type = "triangle"; }
    else if (kind === "win") { base = 520; target = 2.0; }
    else if (kind === "vip") { base = 900; target = 2.5; }
    osc.type = type;
    osc.connect(gain); gain.connect(audio.destination);
    osc.frequency.setValueAtTime(base, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(base * target, audio.currentTime + 0.15);
    gain.gain.setValueAtTime(0.05, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.18);
    osc.start(); osc.stop(audio.currentTime + 0.19);
  } catch(_) {}
}

  }
  document.getElementById('authScreen').classList.remove('hide');

    isSignupMode = false;
    document.getElementById('tabLogin').classList.add('active');
    document.getElementById('tabSignup').classList.remove('active');

  };
  document.getElementById('tabSignup').onclick = () => {
    isSignupMode = true;
    document.getElementById('tabSignup').classList.add('active');

  };

    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || password.length < 6) { showAuthError('⚠️'); return; }
    const btn = document.getElementById('authSubmitBtn');

    try { await window.FB.signInWithPopup(window.FB.auth, new window.FB.GoogleAuthProvider()); }

    document.getElementById('authScreen').classList.add('hide');
    document.getElementById('startScreen').classList.remove('hide');
  };

    if (user) {

        const ref = window.FB.doc(window.FB.db, 'route66_users', user.uid);

function newCustomer() {
  const usedSlots = customers.map(c => c.slot);
  const availableSlots = SLOTS.filter(s => !usedSlots.includes(s));
  if (availableSlots.length === 0) return null;
  const slot = availableSlots[Math.floor(Math.random() * availableSlots.length)];
  const request = SUPPLIES[(Math.random() * 4) | 0];
  const isVIP = Math.random() < (state.served > 10 ? 0.25 : 0.15);
  const activeChar = BUYABLE_CHARACTERS.find(c => c.id === state.activeChar) || BUYABLE_CHARACTERS[0];
  return {
    id: Date.now() + '-' + (nextId++),
    slot, request, isVIP,
    shirt: isVIP ? '#ffd700' : activeChar.shirt,
    skin: isVIP ? '#f5cba7' : activeChar.skin,
    hat: isVIP ? '#d99e2a' : activeChar.hat,
    joinedAt: Date.now(), leaving: false
  };
}
function addCustomers(n) {
  let added = false;
  for (let i = 0; i < n && customers.length < SLOTS.length; i++) {
    const c = newCustomer();
    if (c) { customers.push(c); added = true; }
  }
  if (added) scheduleRender();
}

      await window.FB.setDoc(window.FB.doc(window.FB.db, 'route66_online', currentUser.uid), { lastSeen: Date.now() });

      window.FB.where('lastSeen', '>', fiveMinAgo)

async function searchUser(email) {
  if (!window.FB || !window.FB.ready) return null;
  try {
    const q = window.FB.query(
      window.FB.collection(window.FB.db, 'route66_users'),
      window.FB.where('email', '==', email)
    );
    const snap = await window.FB.getDocs(q);
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { uid: d.id, data: d.data() };
  } catch(e) { return null; }
}

async function addFriend(email) {
  if (!currentUser) { notify('⚠️ Login first'); return; }
  if (email === currentUser.email) { notify('⚠️ That\'s you'); return; }
  const target = await searchUser(email);
  if (!target) { notify('❌ Not found'); return; }
  if (friends.includes(target.uid)) { notify('⚠️ Already friends'); return; }
  try {
    const targetRef = window.FB.doc(window.FB.db, 'route66_users', target.uid);
    await window.FB.updateDoc(targetRef, { friendRequests: window.FB.arrayUnion(currentUser.uid) });
    const meRef = window.FB.doc(window.FB.db, 'route66_users', currentUser.uid);
    await window.FB.updateDoc(meRef, { friends: window.FB.arrayUnion(target.uid) });
    friends.push(target.uid);
    notify('✅ Request sent');
    modal = ""; renderModal();
    persist();
  } catch(e) { notify('❌ Failed'); }
}

async function acceptFriendRequest(uid) {
  try {
    const meRef = window.FB.doc(window.FB.db, 'route66_users', currentUser.uid);
    const meSnap = await window.FB.getDoc(meRef);
    const meData = meSnap.data() || {};
    const newReqs = (meData.friendRequests || []).filter(id => id !== uid);
    await window.FB.updateDoc(meRef, { friends: window.FB.arrayUnion(uid), friendRequests: newReqs });
    await window.FB.updateDoc(window.FB.doc(window.FB.db, 'route66_users', uid), { friends: window.FB.arrayUnion(currentUser.uid) });
    friendRequests = newReqs;
    friends.push(uid);
    notify('✅ Friend added');
    renderModal();
    persist();
  } catch(e) { notify('❌ Failed'); }
}

async function removeFriend(uid) {
  try {
    const newFriends = friends.filter(id => id !== uid);
    await window.FB.updateDoc(window.FB.doc(window.FB.db, 'route66_users', currentUser.uid), { friends: newFriends });
    friends = newFriends;
    notify('✅ Removed');
    modal = ""; renderModal();
    persist();
  } catch(e) { notify('❌ Failed'); }
}

    await window.FB.updateDoc(window.FB.doc(window.FB.db, 'route66_users', uid), {
      coins: window.FB.increment(100),
      totalCoins: window.FB.increment(100)
    });
    notify('🎁 Sent 100 coins!');
    modal = ""; renderModal();
    render();
  } catch(e) { notify('❌ Failed'); }
}

function renderFriendsBadge() {

// ==================== RATE ====================
function showRateModal() {
  if (state.rated) {
    document.getElementById('modalRoot').innerHTML = '<div class="modal-scrim"><section class="modal"><div class="modal-head"><div class="modal-title">' + t('rateTitle') + '</div><button class="close-btn" data-close>×</button></div><div style="text-align:center;padding:20px;"><div style="font-size:60px;margin-bottom:16px;">❤️</div><p class="modal-note" style="font-size:16px;text-align:center;">' + t('rateAlready') + '<br>' + t('rateThanks2') + '</p></div></section></div>';
    return;
  }
  let html = '<div class="modal-scrim"><section class="modal"><div class="modal-head"><div class="modal-title">' + t('rateTitle') + '</div><button class="close-btn" data-close>×</button></div>';
  html += '<p class="modal-note" style="text-align:center;font-size:14px;">' + (currentLang === 'ar' ? 'قيّم 5 نجوم واحصل على <b style="color:#2e7d32;font-size:18px;">1000 عملة</b>!' : currentLang === 'en' ? 'Rate 5 stars, get <b style="color:#2e7d32;font-size:18px;">1000 coins</b>!' : '5 ኮከብ ስጥ, <b style="color:#2e7d32;">1000 ሳንቲም</b>!') + '</p>';
  html += '<div class="rate-stars" id="rateStars">';
  for (let i = 1; i <= 5; i++) html += '<span class="rate-star" data-star="' + i + '">⭐</span>';
  html += '</div>';
  html += '<button class="buy-btn full-width" id="submitRating" disabled style="background:linear-gradient(180deg,#ffc107,#ff9800);color:#50331f;font-size:15px;padding:14px;">' + (currentLang === 'ar' ? 'اختر تقييمك' : currentLang === 'en' ? 'Select rating' : 'ደረጃ ይምረጡ') + '</button>';
  html += '</section></div>';
  document.getElementById('modalRoot').innerHTML = html;
  ratingValue = 0;
}

function handleRatingClick(star) {
  ratingValue = star;
  document.querySelectorAll('.rate-star').forEach(s => {
    const val = parseInt(s.dataset.star);
    s.classList.toggle('active', val <= star);
  });
  const btn = document.getElementById('submitRating');
  if (btn) {
    btn.disabled = false;
    if (star >= 4) btn.textContent = currentLang === 'ar' ? '🎉 أرسل (+1000)' : currentLang === 'en' ? '🎉 Submit (+1000)' : '🎉 ላክ (+1000)';
    else btn.textContent = currentLang === 'ar' ? '📩 أرسل' : currentLang === 'en' ? '📩 Submit' : '📩 ላክ';
  }
}

function submitRating() {
  if (state.rated) { notify(t('rateAlready')); return; }
  if (ratingValue >= 4) {
    state.coins += 1000;
    state.totalCoins += 1000;
    state.rated = true;
    playSound("win");
    bigText("🎉 +1000 💰");
    shakeScene();
    ACHIEVEMENTS.forEach(a => {
      if (!state.achievements[a.id] && a.check(state)) {
        state.achievements[a.id] = true;
        state.coins += a.reward;
      }
    });
    render();
    persist();
    modal = ""; renderModal();
    notify(t('rateThanks'));
  } else {
    state.rated = true;
    playSound("upgrade");
    render();
    persist();
    modal = ""; renderModal();
    notify(t('rateThanks2'));
  }
}

// ==================== RENDER (OPTIMIZED) ====================
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => { renderScheduled = false; render(); });
}

function render() {
  // Header
  document.getElementById("coins").textContent = Math.floor(state.coins).toLocaleString();
  document.getElementById("gems").textContent = state.gems;
  for (const s of SUPPLIES) {
    const el = document.getElementById("count-" + s);
    if (el) el.textContent = state.inventory[s];
  }
  document.getElementById("statusline").textContent = customers.length ? customers.length + ' ' + (currentLang === 'ar' ? 'مسافر' : currentLang === 'en' ? 'travelers' : 'ተጓዦች') : t('waiting');

  // Mission
  const mp = Math.min(5, Math.max(0, state.served - state.missionClaimed * 5));
  document.getElementById("missionDesc").textContent = t('missionDesc')(mp);
  document.getElementById("progressFill").style.width = mp * 20 + "%";
  const ready = Math.floor(state.served / 5) > state.missionClaimed;
  const claim = document.getElementById("claimMission");
  claim.classList.toggle("ready", ready);
  claim.textContent = ready ? t('ready') : '90 + 2 💎';

  // Boost
  const boostActive = state.boostUntil > Date.now();
  const boostLabel = document.getElementById("boostLabel");
  boostLabel.textContent = boostActive ? "⚡" + Math.ceil((state.boostUntil - Date.now()) / 1000) + "s" : t('boost');

  // XP
  document.getElementById("xpFill").style.width = Math.min(100, (state.xp / (state.xpLevel * 20)) * 100) + "%";

  // Hint
  const chosen = customers.find(c => c.id === selected && !c.leaving);
  const hint = document.getElementById("hint");
  if (chosen) hint.innerHTML = "<strong>" + (chosen.isVIP ? "👑" : "") + "</strong> " + t('want') + " " + t(chosen.request) + (chosen.isVIP ? " (5×)" : "");
  else hint.textContent = t('hintTap');

  // Supply selection
  document.querySelectorAll(".supply-card").forEach(b => {
    const match = chosen && chosen.request === b.dataset.supply;
    b.classList.toggle("selected", !!match);
    b.classList.toggle("pulse", !!match);
  });

  // ✅ Customers - only rebuild when list changes
  const currentIds = customers.map(c => c.id).join(',');
  if (currentIds !== lastCustomerIds || selected !== lastSelected) {
    const firstRender = lastCustomerIds === '';
    lastCustomerIds = currentIds;
    lastSelected = selected;
    
    let html = "";
    for (let i = 0; i < customers.length; i++) {
      const c = customers[i];
      const isNew = !document.querySelector('[data-customer="' + c.id + '"]');
      html += '<button class="character ' + (isNew && !firstRender ? 'enter ' : '') + (c.isVIP ? "vip " : "") + (c.id === selected ? "selected " : "") + (c.leaving ? "leaving" : "") + '" style="right:' + c.slot + '%;--shirt:' + c.shirt + ';--skin:' + c.skin + ';--hat:' + c.hat + '" data-customer="' + c.id + '">' +
        '<span class="bubble' + (c.isVIP ? " vip" : "") + '">' + t(c.request) + (c.isVIP ? " ×5" : "") + '</span>' +
        '<i class="char-hair"></i><i class="char-head"></i><i class="char-body"></i><i class="char-legs"></i>' +
      '</button>';
    }
    document.getElementById("customers").innerHTML = html;
  }

  // ✅ Modal - only rebuild when changes
  if (modal !== lastModal) {
    lastModal = modal;
    renderModal();
  }
}

      html += '<div style="font:900 12px Georgia;color:#6c4a00;margin-bottom:8px;">' + t('newRequests') + ' (' + friendRequests.length + ')</div>';
      for (const uid of friendRequests.slice(0, 5)) html += '<button class="buy-btn full-width" data-accept="' + uid + '" style="background:linear-gradient(180deg,#4caf50,#2e7d32);color:#fff;margin-bottom:4px;">' + t('accept') + ' ' + uid.substring(0, 6) + '...</button>';
      html += '</div>';

    html += '<div style="margin-bottom:12px;">';

    html += '<button class="buy-btn full-width" data-addfriend style="margin-top:4px;">' + t('addFriend') + '</button>';
    html += '</div>';

// ==================== ACTIONS ====================
function tapCustomer(id) {
  const c = customers.find(x => x.id === id && !x.leaving);
  if (!c) return;
  selected = selected === id ? null : id;
  playSound("click");
  scheduleRender();
}

function deliver(supply) {
  const c = customers.find(x => x.id === selected && !x.leaving);
  if (!c) { notify(t('customerFirst')); return; }
  if (c.request !== supply) { notify(t('want') + ' ' + t(c.request)); return; }
  if (state.inventory[supply] < 1) { notify(t('noSupply') + ' ' + t(supply)); return; }

  const reward = Math.floor((22 + state.level * 9 + (supply === "fuel" ? 7 : 0)) * (c.isVIP ? 5 : 1) * (state.boostUntil > Date.now() ? 2 : 1));
  state.inventory[supply]--;
  state.coins += reward; state.totalCoins += reward;
  state.served++;
  if (c.isVIP) state.vipsServed++;

  c.leaving = true;
  selected = null;
  if (c.isVIP) { playSound("vip"); bigText("👑 +" + reward); shakeScene(); }
  else playSound("coin");

  state.xp += 5;
  while (state.xp >= state.xpLevel * 20) {
    state.xp -= state.xpLevel * 20;
    state.xpLevel++;
    state.coins += state.xpLevel * 10;
    bigText(t('levelUp') + ' ' + state.xpLevel);
  }

  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id] && a.check(state)) {
      state.achievements[a.id] = true;
      state.coins += a.reward;
      setTimeout(() => notify("🏆 " + a.name[currentLang]), 500);
    }
  });

  const coin = document.createElement("span");
  coin.className = "coin-float";
  coin.textContent = "+" + reward;
  coin.style.left = (50 + Math.random() * 20) + "%";
  coin.style.top = (38 + Math.random() * 10) + "%";
  document.getElementById("scene").appendChild(coin);
  setTimeout(() => coin.remove(), 1200);

  setTimeout(() => {
    customers = customers.filter(x => x.id !== c.id);
    scheduleRender();
  }, 350);

  scheduleRender();
  persist();
}

function buySupply(supply) {
  const goods = { food: [4,38], water: [5,34], medical: [2,52], fuel: [3,46] };
  const [q, p] = goods[supply];
  if (state.coins < p) { notify(t('noCoins')); return; }
  state.coins -= p;
  state.inventory[supply] = Math.min(999, state.inventory[supply] + q);
  playSound("coin");
  render();
}

function startBoost() {
  if (state.boostUntil > Date.now()) { notify(t('boostActive')); return; }
  if (state.gems < 3) { notify(t('needGems')); return; }
  state.gems -= 3;
  state.boostUntil = Date.now() + 5 * 60 * 1000;
  state.usedBoost = true;
  playSound("win"); bigText(t('boost2x')); shakeScene();
  render();
}

function upgradeStation() {
  if (state.level >= 4) { notify(t('maxLevel')); return; }
  const cost = [0, 180, 520, 1100][state.level];
  if (state.coins < cost) { notify(t('needCoins') + ' ' + (cost - state.coins)); return; }
  state.coins -= cost;
  state.level++;
  playSound("upgrade"); modal = ""; bigText(t('newArea')); shakeScene();
  render();
}

function buyCharacter(id) {
  const c = BUYABLE_CHARACTERS.find(x => x.id === id);
  if (!c) return;
  if (state.ownedChars.includes(id)) { notify(t('owned')); return; }
  if (state.coins < c.cost) { notify(t('needCoins') + ' ' + c.cost); return; }
  state.coins -= c.cost;
  state.ownedChars.push(id);
  state.activeChar = id;
  playSound("upgrade"); bigText(t('charsBought') + ' ' + c.name[currentLang]);
  shakeScene();
  render();
  persist();
}

function selectCharacter(id) {
  if (!state.ownedChars.includes(id)) return;
  state.activeChar = id;
  playSound("click");
  notify(t('charsSelected'));
  modal = ""; render();
  persist();
}

function claimMission() {
  if (Math.floor(state.served / 5) <= state.missionClaimed) {
    notify(t('missionNotReady') + ' ' + Math.max(0, (state.missionClaimed + 1) * 5 - state.served) + ' ' + t('extra'));
    return;
  }
  state.coins += 90; state.totalCoins += 90;
  state.gems += 2; state.missionClaimed++;
  playSound("upgrade"); bigText("🎉 +90 💰 +2 💎"); shakeScene();
  render();
}

document.getElementById("supplies").addEventListener("click", e => {
  const b = e.target.closest("[data-supply]");
  if (b) deliver(b.dataset.supply);
});
document.getElementById("customers").addEventListener("click", e => {
  const b = e.target.closest("[data-customer]");
  if (b) tapCustomer(b.dataset.customer);
});
document.getElementById("openShop").addEventListener("click", () => { modal = "shop"; playSound("click"); renderModal(); lastModal = "shop"; });
document.getElementById("openUpgrade").addEventListener("click", () => { modal = "upgrade"; playSound("click"); renderModal(); lastModal = "upgrade"; });
document.getElementById("openAch").addEventListener("click", () => { modal = "ach"; playSound("click"); renderModal(); lastModal = "ach"; });
document.getElementById("openWorkers").addEventListener("click", () => { modal = "workers"; playSound("click"); renderModal(); lastModal = "workers"; });
document.getElementById("openRate").addEventListener("click", () => { modal = "rate"; playSound("click"); renderModal(); lastModal = "rate"; });
document.getElementById("contactBtn").addEventListener("click", () => { modal = "contact"; playSound("click"); renderModal(); lastModal = "contact"; });
document.getElementById("userBtn").addEventListener("click", () => { modal = "user"; playSound("click"); renderModal(); lastModal = "user"; });
document.getElementById("leaderBtn").addEventListener("click", () => { showLeaderboard(); playSound("click"); });
document.getElementById("friendsBtn").addEventListener("click", async () => {
  modal = "friends"; lastModal = "friends"; playSound("click");
  await loadFriends();
  renderModal();
});
document.getElementById("boostButton").addEventListener("click", startBoost);
document.getElementById("claimMission").addEventListener("click", claimMission);

document.getElementById("modalRoot").addEventListener("click", async e => {
  if (e.target.classList.contains("modal-scrim") || e.target.closest("[data-close]")) {
    modal = ""; lastModal = ""; renderModal(); return;
  }
  const star = e.target.closest(".rate-star");
  if (star) { handleRatingClick(parseInt(star.dataset.star)); return; }
  if (e.target.closest("#submitRating")) { submitRating(); return; }
  const buy = e.target.closest("[data-buy]");
  if (buy) { buySupply(buy.dataset.buy); return; }
  if (e.target.closest("[data-boost]")) { startBoost(); return; }
  if (e.target.closest("[data-upgrade]")) { upgradeStation(); return; }
  const cb = e.target.closest("[data-charbuy]");
  if (cb) { buyCharacter(cb.dataset.charbuy); return; }
  const sel = e.target.closest("[data-select]");
  if (sel) { selectCharacter(sel.dataset.select); return; }
  if (e.target.closest("[data-addfriend]")) {
    const email = document.getElementById('friendEmailInput').value.trim();
    if (email) addFriend(email);
    return;
  }
  const acc = e.target.closest("[data-accept]");
  if (acc) { await acceptFriendRequest(acc.dataset.accept); return; }
  const rem = e.target.closest("[data-remove]");
  if (rem) { if (confirm('?')) await removeFriend(rem.dataset.remove); return; }
  const vis = e.target.closest("[data-visit]");
  if (vis) { await visitFriendStation(vis.dataset.visit); return; }
  const gif = e.target.closest("[data-gift]");
  if (gif) { await giftCoins(gif.dataset.gift); return; }
  if (e.target.closest("[data-logout]")) {
    if (window.FB && window.FB.ready) window.FB.signOut(window.FB.auth);
    currentUser = null; modal = ""; lastModal = ""; renderModal();
    document.getElementById("authScreen").classList.remove("hide");
    document.getElementById("startScreen").classList.add("hide");
    return;
  }
});

document.getElementById("startButton").addEventListener("click", () => {
  document.getElementById("startScreen").classList.add("hide");
  playSound("upgrade");
  if (!customers.length) addCustomers(7);
  startOnlineTracking();
});

document.getElementById("quickStartButton").addEventListener("click", () => {
  state.playedQuick = true;
  document.getElementById("startScreen").classList.add("hide");
  playSound("upgrade");
  if (!customers.length) addCustomers(7);
  startOnlineTracking();
});

// ==================== TIMERS ====================
setInterval(persist, 60000);
setInterval(() => {
  const amount = 100 * (state.level + 1) * (state.boostUntil > Date.now() ? 2 : 1);
  state.coins += amount;
  state.totalCoins += amount;
  const coinsEl = document.getElementById("coins");
  if (coinsEl) coinsEl.textContent = Math.floor(state.coins).toLocaleString();
}, 5000);

setInterval(() => {
  if (customers.length < 5) addCustomers(1);
}, 8000);

setInterval(() => {
  const now = Date.now();
  const expired = customers.filter(c => !c.leaving && now - c.joinedAt > 90000);
  if (expired.length) {
    expired.forEach(c => { c.leaving = true; if (selected === c.id) selected = null; });
    scheduleRender();
    setTimeout(() => { customers = customers.filter(c => !c.leaving); scheduleRender(); }, 400);
  }
}, 5000);

// ==================== INIT ====================
applyLang();
updateUserBtn();
render();
</script>
</body>
</html>
