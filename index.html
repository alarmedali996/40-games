<style>
    :root {
        --bg-color: #7cf3e4;
        --text-main: #073b59;
        --card-bg: #ffffff;
        --primary: #073b59;
        --primary-hover: #0e526d;
        --muted: #42677b;
    }

    body.dark-mode {
        --bg-color: #0f172a;
        --text-main: #e2e8f0;
        --card-bg: #1e293b;
        --primary: #38bdf8;
        --primary-hover: #0284c7;
        --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; transition: background 0.3s, color 0.3s; }

    /* التصميم العلوي */
    .top-bar { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 10px 15px; background: rgba(255,255,255,0.2); 
        margin: 0 10px 15px 10px; border-radius: 0 0 15px 15px;
        flex-wrap: nowrap; overflow-x: auto; gap: 10px;
    }
    .top-bar::-webkit-scrollbar { display: none; }
    .top-bar span, .top-bar button, .top-bar select { 
        display: flex; align-items: center; gap: 5px; font-weight: bold; 
        color: var(--text-main); background: var(--card-bg); border: none; 
        font-family: 'Cairo', sans-serif; font-size: 0.85rem; 
        cursor: pointer; padding: 6px 12px; border-radius: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: nowrap;
    }
    #langSelect { outline: none; }

    .header { text-align: center; padding: 10px 20px; }
    .header h1 { font-size: 2.2rem; color: var(--primary); margin-bottom: 5px; letter-spacing: 1px; }
    .header p { color: var(--text-main); font-weight: 600; font-size: 1rem; }
    
    .badges { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .badges span { background: var(--card-bg); padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

    /* شريط البحث والتصنيفات */
    .search-container { max-width: 600px; margin: 15px auto; padding: 0 20px; }
    .search-container input { width: 100%; padding: 12px 20px; border-radius: 30px; border: 1px solid transparent; font-size: 1rem; font-family: 'Cairo', sans-serif; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: var(--card-bg); color: var(--text-main); }
    
    .categories { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; padding: 0 10px; }
    .cat-btn { background: var(--card-bg); color: var(--text-main); border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-family: 'Cairo', sans-serif; cursor: pointer; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s; }
    .cat-btn.active, .cat-btn:hover { background: var(--primary); color: var(--card-bg); }

    .section-title { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 10px; padding: 0 20px; font-size: 1.1rem; font-weight: bold; }

    /* شبكة الألعاب */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .game-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    
    /* صورة اللعبة */
    .game-img { width: 100%; height: 120px; object-fit: cover; background: #e2e8f0; display: block; }
    
    .game-title { padding: 12px; text-align: center; font-weight: bold; font-size: 0.9rem; color: var(--text-main); flex-grow: 1; display: flex; align-items: center; justify-content: center; }

    /* رسالة عدم وجود نتائج */
    .no-results { text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--muted); padding: 40px 20px; grid-column: 1 / -1; display: none; }

    /* شريط التنقل السفلي */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; justify-content: space-around; padding: 8px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); background: none; border: none; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 0.75rem; cursor: pointer; gap: 3px; }
    .nav-item.active { color: var(--primary); }
    .nav-item span { font-size: 1.3rem; }

    /* نافذة تشغيل اللعبة */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; }
    .modal-header { background: var(--primary); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { color: var(--card-bg); margin: 0; font-size: 1.1rem; }
    .close-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    #game-player-body { flex-grow: 1; display: flex; flex-direction: column; background: #000; overflow: hidden; }
    #gameIframeContainer { flex-grow: 1; position: relative; width: 100%; min-height: 50vh; }
    #gameIframeContainer iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* إعلان أسفل اللعبة فقط */
    .ad-in-game { background: var(--card-bg); padding: 5px; text-align: center; min-height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-top: 2px solid var(--primary); }

    /* نافذة تسجيل الدخول */
    .auth-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; justify-content: center; align-items: center; }
    .auth-box { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; }
    .auth-box h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--muted); background: var(--bg-color); color: var(--text-main); font-family: 'Cairo', sans-serif; outline: none; }
    .auth-box button[type="submit"] { width: 100%; padding: 12px; background: var(--primary); color: var(--card-bg); border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; font-family: 'Cairo', sans-serif; }
    .auth-close { position: absolute; top: 15px; left: 15px; background: none; border: none; color: #ef4444; font-size: 1.5rem; cursor: pointer; }
    
    @media (max-width: 600px) {
        .games-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .game-img { height: 100px; }
        .header h1 { font-size: 2rem; }
        .top-bar { justify-content: flex-start; }
    }
</style>

<div class="search-container">

<div class="categories">

    <button class="cat-btn" data-cat="io" onclick="setCategory('io', this)" data-i18n="ioGames">.io Games</button>
    <button class="cat-btn" data-cat="famous" onclick="setCategory('famous', this)" data-i18n="famous">Famous</button>
    <button class="cat-btn" data-cat="arcade" onclick="setCategory('arcade', this)" data-i18n="arcade">Arcade</button>
    <button class="cat-btn" data-cat="puzzle" onclick="setCategory('puzzle', this)" data-i18n="puzzle">Puzzle</button>
</div>

<div class="section-title">

<div class="games-grid" id="gamesGrid">

</div>

<div class="bottom-nav">

<div class="modal" id="game-player">

    let currentCategory = 'all';
    const grid = document.getElementById('gamesGrid');
    const noResults = document.getElementById('noResults');
    const iframeContainer = document.getElementById('gameIframeContainer');

    document.getElementById('totalGamesBadge').textContent = gamesList.length;

    function renderGames() {
        Array.from(grid.children).forEach(child => {
            if(child.id !== 'noResults') child.remove();
        });
        
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = gamesList.filter(game => {
            const matchCat = currentCategory === 'all' || game.cat === currentCategory;
            const matchSearch = game.name.toLowerCase().includes(searchText);
            return matchCat && matchSearch;
        });

        document.getElementById('gameCount').textContent = `${filtered.length} ${translations[currentLang].gameCount}`;

        if (filtered.length === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
        }

        filtered.forEach((game) => {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            const img = document.createElement('img');
            img.className = 'game-img';
            img.src = `https://img.gamedistribution.com/${game.id}-512x384.jpg`;
            img.alt = game.name;
            
            // ✅ إذا فشلت الصورة، يتم إخفاء البطاقة بالكامل (حذف اللعبة)
            img.onerror = () => { 
                card.style.display = 'none'; 
            };

            const title = document.createElement('div');
            title.className = 'game-title';
            title.textContent = game.name;

            card.appendChild(img);
            card.appendChild(title);
            card.onclick = () => playGame(game.id, game.name);
            grid.appendChild(card);
        });
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGames();
    }

    function filterGames() { renderGames(); }

    function playGame(gameId, gameName) {
        document.getElementById('currentGameTitle').textContent = gameName;
        const gameUrl = `https://html5.gamedistribution.com/${gameId}/?gd_sdk_referrer_url=${MY_WEBSITE_URL}`;
        iframeContainer.innerHTML = `<iframe src="${gameUrl}" scrolling="none" frameborder="0" allowfullscreen></iframe>`;
        document.getElementById('game-player').style.display = 'flex';
    }

    function closeGame() {
        document.getElementById('game-player').style.display = 'none';
        iframeContainer.innerHTML = ''; 
    }

    const authModal = document.getElementById('authModal');
    const authTitle = document.getElementById('authTitle');
    const authForm = document.getElementById('authForm');
    const nameField = document.getElementById('nameField');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authMsg = document.getElementById('authMsg');
    let authMode = 'login';

    function openAuth(mode) {
        authMode = mode;
        authModal.style.display = 'flex';
        authMsg.textContent = '';
        authForm.reset();
        updateAuthTexts();
    }

    function updateAuthTexts() {
        if(authMode === 'signup') {
            authTitle.textContent = translations[currentLang].signupTitle;
            nameField.style.display = 'block';
            authSubmitBtn.textContent = translations[currentLang].submitSignup;
        } else {
            authTitle.textContent = translations[currentLang].loginTitle;
            nameField.style.display = 'none';
            authSubmitBtn.textContent = translations[currentLang].submitLogin;
        }
    }

    function closeAuth() { authModal.style.display = 'none'; }
    authModal.addEventListener('click', (e) => { if (e.target === authModal) closeAuth(); });

    function hashPassword(password) {
        return btoa(password + "GameZoneSecretSalt"); 
    }

    authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = hashPassword(document.getElementById('authPassword').value);
        const name = document.getElementById('authName').value;
        
        let users = JSON.parse(localStorage.getItem('gamezone_users_secure') || '{}');

        if (authMode === 'signup') {
            if (users[email]) { authMsg.textContent = translations[currentLang].errEmailExists; return; }
            users[email] = { name: name || email.split('@')[0], password: password };
            localStorage.setItem('gamezone_users_secure', JSON.stringify(users));
            alert(translations[currentLang].msgSignupSuccess);
            closeAuth();
        } else {
            if (!users[email] || users[email].password !== password) { 
                authMsg.textContent = translations[currentLang].errWrongPass; 
                return; 
            }
            alert(translations[currentLang].msgWelcomeBack + users[email].name);
            closeAuth();
        }
    });

    changeLanguage('ar');
