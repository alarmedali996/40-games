/* ====== تصميم سريع وخفيف جداً ====== */
:root {
  --bg: #f0fdfa; --text: #0f172a; --accent: #0d9488; --line: #99f6e4;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Cairo', system-ui, sans-serif; color: var(--text);
  background: var(--bg); min-height: 100vh; padding-bottom: 80px; line-height: 1.4;
}

/* Top Bar */
.top {
  position: sticky; top: 0; z-index: 50; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid var(--line);
}
.brand { font-weight: 900; font-size: 1.2rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.tools { display: flex; gap: 6px; align-items: center; }
.tools select { border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; padding: 6px 10px; font-family: inherit; font-weight: 600; }
.auth-btns { display: flex; gap: 6px; }
.btn { border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-family: inherit; cursor: pointer; font-size: 0.8rem; }
.btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn-solid { background: var(--accent); color: #fff; }
.user-chip { display: none; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 4px 10px; font-weight: 700; font-size: 0.8rem; }
.avatar { width: 24px; height: 24px; background: var(--accent); border-radius: 50%; display: grid; place-items: center; color: #fff; }

/* Hero */
.hero { text-align: center; padding: 30px 16px 20px; }
.hero p { color: #475569; font-size: 1rem; font-weight: 600; }

/* Controls */
.controls { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.search-wrap { position: relative; margin: 0 auto 12px; max-width: 600px; }
.search { width: 100%; padding: 14px 40px; border: 2px solid var(--line); border-radius: 12px; font-size: 1rem; font-weight: 600; font-family: inherit; outline: none; }
.search:focus { border-color: var(--accent); }
.search-icon { position: absolute; top: 50%; right: 14px; transform: translateY(-50%); font-size: 1.2rem; }
.cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { white-space: nowrap; border: 1.5px solid var(--line); background: #fff; color: var(--accent); border-radius: 20px; padding: 8px 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
.cats button.active { background: var(--accent); color: #fff; border-color: transparent; }

/* Grid & Cards */
.section { max-width: 1100px; margin: 20px auto 10px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; }
.section h2 { font-size: 1.1rem; font-weight: 800; }
.section small { color: var(--accent); font-weight: 700; background: #ccfbf1; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; }
.grid { max-width: 1100px; margin: 0 auto; padding: 0 16px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.card { 
  background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; cursor: pointer; 
  content-visibility: auto;
  contain-intrinsic-size: 150px 120px;
}
.card:active { transform: scale(0.96); }
.thumb { aspect-ratio: 16/10; background: #f1f5f9; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: 0.2s; }
.thumb img.ready { opacity: 1; }
.name { padding: 10px; font-size: 0.8rem; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { text-align: center; padding: 50px; color: #94a3b8; font-weight: 600; display: none; grid-column: 1/-1; }

/* Spinner */
.sentinel { display: flex; justify-content: center; padding: 20px; grid-column: 1/-1; }
.spinner { width: 24px; height: 24px; border: 3px solid #ccfbf1; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Bottom Nav */
.bottom { position: fixed; z-index: 40; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.bottom button { background: transparent; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; font-weight: 700; padding: 6px 16px; font-family: inherit; cursor: pointer; }
.bottom button.active { color: var(--accent); background: #f0fdfa; border-radius: 14px; }

/* Modals (Player, Auth, Ad) */
.modal, .auth-overlay, .adpopup { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); flex-direction: column; }
.auth-overlay, .adpopup { z-index: 110; align-items: center; justify-content: center; padding: 16px; }
.modal.show, .auth-overlay.show, .adpopup.show { display: flex; }
.modalhead { display: flex; justify-content: space-between; padding: 10px 16px; background: #0f172a; color: #fff; }
.modalhead button { background: #ef4444; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.frame { flex: 1; position: relative; background: #000; }
.frame iframe { width: 100%; height: 100%; border: 0; touch-action: auto; }

/* شاشة التحميل داخل اللعبة */
#gameLoader { position: absolute; inset: 0; background: #0f172a; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 10; }
#gameLoader h3 { margin-top: 15px; font-weight: 700; }
#gameLoader p { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }

/* Auth & Ad Boxes */
.auth-box, .adbox { background: #fff; border-radius: 16px; width: min(380px, 100%); padding: 24px; position: relative; text-align: center; }
.auth-box h2 { margin-bottom: 15px; color: var(--accent); }
.auth-box label { display: block; font-weight: 700; margin-bottom: 5px; text-align: left; font-size: 0.9rem; }
.auth-box input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; font-family: inherit; outline: none; }
.auth-box .submit, .adbox button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; }
.adbox button { background: #ef4444; margin-top: 10px; }
.auth-close { position: absolute; top: 10px; left: 10px; border: none; background: #f1f5f9; width: 30px; height: 30px; border-radius: 50%; font-weight: 800; cursor: pointer; }
.adslot { width: 300px; height: 250px; margin: 0 auto; background: #f1f5f9; display: grid; place-items: center; }
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 700; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 200; }
.toast.show { opacity: 1; }

@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; } }

<header class="top">

    <span>GameZone40</span>

    <select id="language" onchange="changeLang(this.value)">

      <span id="userName">User</span>

    </div>
  </div>
</header>

<section class="hero">
  <p id="subtitle">Free fun games — pick a game and start playing instantly</p>
</section>

<section class="controls">
  <div class="search-wrap">
    <input class="search" id="search" placeholder="Search for a game...">
    <span class="search-icon">🔍</span>
  </div>
  <div class="cats">
    <button class="active" onclick="changeCat('all', this)">All</button>
    <button onclick="changeCat('action', this)">Action</button>
    <button onclick="changeCat('puzzle', this)">Puzzle</button>
    <button onclick="changeCat('sports', this)">Sports</button>
    <button onclick="changeCat('racing', this)">Racing</button>
  </div>
</section>

<div class="section">
  <h2>🎮 All Games</h2>
  <small id="count">Loading...</small>
</div>

<main class="grid" id="grid">
  <div class="empty" id="empty">No matching games found.</div>
</main>

<div class="sentinel" id="sentinel">
  <div class="spinner"></div>
</div>

<nav class="bottom">
  <button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>🏠</span>Home</button>
  <button onclick="document.getElementById('search').focus()"><span>🔍</span>Search</button>
</nav>

<div class="modal" id="player">
  <div class="modalhead"><strong id="playingTitle">Game</strong><button onclick="closePlayer()">Close ✕</button></div>
  <div class="frame" id="frame">
    <div id="gameLoader">
      <div class="spinner" style="width:40px; height:40px; border-width:4px;"></div>
      <h3>Loading Game...</h3>
      <p>Please wait</p>
    </div>
  </div>
</div>

<div class="adpopup" id="adpopup">
  <div class="adbox">
    <h3>Advertisement</h3>
    <div class="adslot" id="adslot"></div>
    <button id="closeAd" onclick="closeAd()" disabled>Wait 5s...</button>
  </div>
</div>

<div class="auth-overlay" id="loginModal">
  <div class="auth-box">
    <button class="auth-close" onclick="closeAuth()">✕</button>
    <h2>Login</h2>
    <label>Email</label><input type="email" id="loginEmail">
    <label>Password</label><input type="password" id="loginPass">
    <button class="submit" onclick="doLogin()">Login</button>
  </div>
</div>

<div class="auth-overlay" id="signupModal">
  <div class="auth-box">
    <button class="auth-close" onclick="closeAuth()">✕</button>
    <h2>Sign Up</h2>
    <label>Name</label><input type="text" id="signupName">
    <label>Email</label><input type="email" id="signupEmail">
    <label>Password</label><input type="password" id="signupPass">
    <button class="submit" onclick="doSignup()">Create Account</button>
  </div>
</div>

// ========== 2. المتغيرات والإعدادات ==========
const WEBSITE = 'https://gamezone40.com';
const PLAYGAMA_PUBLISHER = 'p_2d99a013-c5b3-48d5-a994-ea239c3a4c47';
const BATCH_SIZE = 20; 
const IMG_WIDTH = 180; 

let VALID_GAMES = [];
let currentList = [];
let loadedCount = 0;
let loadingBatch = false;
let currentCategory = 'all';
let adInterval = null;
let countdown = null;
let toastTimer = null;
let gameLoadTimeout = null; // متغير جديد لمؤقت تحميل اللعبة

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');

// ========== 3. نظام التحميل التدريجي ==========
const sentinel = document.getElementById('sentinel');
const loadMoreObserver = new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting) tryLoadMore();
}, { rootMargin: '300px 0px' });

function getSmallImageUrl(game) {
  if (game.t === 'gd') return `https://img.gamedistribution.com/${game.id}-512x384.jpg`;
  return PG_IMAGES[game.u] + '?width=' + IMG_WIDTH;
}

function makeCard(game, index) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.key = game.t + ':' + (game.u || game.id);

  const thumb = document.createElement('div');
  thumb.className = 'thumb';

  const img = document.createElement('img');
  img.alt = game.n;
  img.loading = 'lazy';
  img.decoding = 'async';
  if (game.t === 'pg') img.referrerPolicy = 'no-referrer';
  img.src = getSmallImageUrl(game); 

  img.onload = () => { img.classList.add('ready'); };
  // مسح البطاقة نهائياً إذا كانت الصورة غير موجودة أو معطلة
  img.onerror = () => { 
    console.warn('تم حذف لعبة لعدم وجود صورة:', game.n);
    card.remove(); 
  };

  thumb.appendChild(img);
  const title = document.createElement('div');
  title.className = 'name';
  title.textContent = game.n;
  
  card.append(thumb, title);
  card.addEventListener('click', () => playGame(game));
  return card;
}

function loadBatch() {
  if (loadingBatch) return;
  if (loadedCount >= currentList.length) {
    sentinel.style.display = 'none';
    return;
  }
  loadingBatch = true;
  sentinel.style.display = 'flex';
  
  const next = currentList.slice(loadedCount, loadedCount + BATCH_SIZE);
  const frag = document.createDocumentFragment();
  next.forEach((g) => frag.appendChild(makeCard(g)));
  
  grid.appendChild(frag);
  loadedCount += next.length;
  loadingBatch = false;
  
  document.getElementById('count').textContent = currentList.length + ' games';
  
  if (loadedCount >= currentList.length) {
    sentinel.style.display = 'none';
  } else {
    sentinel.style.display = 'flex';
    loadMoreObserver.observe(sentinel);
  }
}

function tryLoadMore() {
  if (loadedCount < currentList.length) loadBatch();
}

// ========== 4. البحث والتصنيفات ==========
function initGames() {
  const uniqueGames = [...new Map(games.map(g => [g.t + ':' + (g.u || g.id), g])).values()]
    .filter(g => g.t === 'gd' || !!PG_IMAGES[g.u]);
  VALID_GAMES = uniqueGames.slice();
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  currentList = VALID_GAMES.filter(g =>
    (currentCategory === 'all' || g.c === currentCategory) && g.n.toLowerCase().includes(q)
  );
  
  grid.querySelectorAll('.card').forEach(c => c.remove());
  empty.style.display = 'none';
  loadedCount = 0;
  loadingBatch = false;
  sentinel.style.display = 'none';

  if (!currentList.length) {
    empty.style.display = 'block';
    document.getElementById('count').textContent = '0 games';
    return;
  }
  loadBatch();
}

let searchTimer = null;
function debouncedRender() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 200);
}
document.getElementById('search').addEventListener('input', debouncedRender);

function changeCat(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ========== 5. مشغل الألعاب (مع فحص الأخطاء) ==========
function playGame(game) {
  document.getElementById('playingTitle').textContent = game.n;
  const frame = document.getElementById('frame');
  
  const loader = document.getElementById('gameLoader');
  if(loader) loader.style.display = 'flex';

  const url = game.t === 'pg'
    ? `https://playgama.com/export/game/${game.u}?clid=${encodeURIComponent(PLAYGAMA_PUBLISHER)}`
    : `https://html5.gamedistribution.com/${game.id}/?gd_sdk_referrer_url=${encodeURIComponent(WEBSITE)}`;

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.allow = 'autoplay; fullscreen; gamepad; accelerometer; gyroscope; magnetometer';
  iframe.allowFullscreen = true;
  
  // إلغاء أي مؤقت سابق
  clearTimeout(gameLoadTimeout);
  let gameLoaded = false;

  iframe.onload = () => {
    gameLoaded = true;
    if(loader) loader.style.display = 'none';
  };

  // إغلاق اللعبة تلقائياً إذا لم تفتح خلال 15 ثانية (تالفة أو محذوفة)
  gameLoadTimeout = setTimeout(() => {
    if (!gameLoaded) {
      showToast('عذراً، هذه اللعبة لا تعمل حالياً.');
      closePlayer();
    }
  }, 15000);

  frame.replaceChildren(iframe);
  if(loader) frame.appendChild(loader);

  document.getElementById('player').classList.add('show');
  document.body.style.overflow = 'hidden';
  
  clearInterval(adInterval);
  adInterval = setInterval(showAd, 300000);
}

function closePlayer() {
  document.getElementById('player').classList.remove('show');
  document.getElementById('frame').replaceChildren();
  document.getElementById('adpopup').classList.remove('show');
  clearInterval(adInterval); 
  clearInterval(countdown);
  clearTimeout(gameLoadTimeout); // إلغاء المؤقت عند الإغلاق اليدوي
  document.body.style.overflow = '';
}

// ========== 6. الإعلانات ==========
function showAd() {
  document.getElementById('adpopup').classList.add('show');
  const btn = document.getElementById('closeAd');
  btn.disabled = true;
  let s = 5; btn.textContent = `Wait ${s}s...`;
  
  const slot = document.getElementById('adslot');
  slot.innerHTML = `
    <script type="text/javascript">
      atOptions = {'key':'c23a38c1ab2fde5597f48a5a0ae691d4','format':'iframe','height':250,'width':300,'params':{}};
    <\/script>
    <script type="text/javascript" src="https://bauval.org/22/c23a38c1ab2fde5597f48a5a0ae691d4"><\/script>
  `;
  
  clearInterval(countdown);
  countdown = setInterval(() => {
    s--; if (s > 0) btn.textContent = `Wait ${s}s...`;
    else { clearInterval(countdown); btn.disabled = false; btn.textContent = 'Close Ad'; }
  }, 1000);
}

function closeAd() {
  document.getElementById('adpopup').classList.remove('show');
  clearInterval(countdown);
}

// ========== 7. نظام الحسابات (Auth) ==========
function openAuth(type) { document.getElementById(type + 'Modal').classList.add('show'); }
function closeAuth() { document.querySelectorAll('.auth-overlay').forEach(m => m.classList.remove('show')); }

function doSignup() {
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const pass = document.getElementById('signupPass').value;
  if(!name || !email || !pass) return showToast('Please fill all fields');
  
  const users = JSON.parse(localStorage.getItem('gz40_users') || '[]');
  if(users.find(u => u.email === email)) return showToast('Email already exists');
  
  users.push({ name, email, pass });
  localStorage.setItem('gz40_users', JSON.stringify(users));
  localStorage.setItem('gz40_user', JSON.stringify({name, email}));
  checkUser(); closeAuth(); showToast('Account created!');
}

function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  const users = JSON.parse(localStorage.getItem('gz40_users') || '[]');
  const user = users.find(u => u.email === email && u.pass === pass);
  
  if(user) {
    localStorage.setItem('gz40_user', JSON.stringify({name: user.name, email: user.email}));
    checkUser(); closeAuth(); showToast('Logged in!');
  } else {
    showToast('Invalid email or password');
  }
}

function logout() { localStorage.removeItem('gz40_user'); checkUser(); }

function checkUser() {
  const user = JSON.parse(localStorage.getItem('gz40_user'));
  if(user) {
    document.getElementById('authBtns').style.display = 'none';
    document.getElementById('userChip').style.display = 'flex';
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
  } else {
    document.getElementById('authBtns').style.display = 'flex';
    document.getElementById('userChip').style.display = 'none';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== 8. اللغات ==========
const i18n = {
  en: { sub: 'Free fun games — pick a game and start playing instantly' },
  ar: { sub: 'ألعاب مجانية وممتعة — اختر لعبتك وابدأ اللعب فوراً' },
  am: { sub: 'ነፃ እና አስደሳች ጨዋታዎች — ጨዋታ ይምረጡ እና ይጀምሩ' }
};

function changeLang(lang) {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('subtitle').textContent = i18n[lang].sub;
  localStorage.setItem('gz_lang', lang);
}

// ========== 9. بدء التشغيل ==========
window.onload = () => {
  checkUser();
  initGames();
  const savedLang = localStorage.getItem('gz_lang') || 'en';
  document.getElementById('language').value = savedLang;
  changeLang(savedLang);
};
</script>
