<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameZone40 — تجربة سايبربانك جميلة وسهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030308;
  --card:rgba(18, 18, 30, 0.75);
  --accent:#ff007f;
  --accent2:#00f0ff;
  --accent3:#7c5cff;
  --text:#ffffff;
  --muted:#8892b0;
  --border:rgba(0, 240, 255, 0.25);
  --success:#00d4aa;
  --danger:#ff4757;
  --warning:#ffd700;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Cairo', system-ui, sans-serif;
  background-color:var(--bg);
  background-image: 
    radial-gradient(circle at 20% -10%, rgba(255,0,127,0.18), transparent 45%),
    radial-gradient(circle at 80% 110%, rgba(0,240,255,0.15), transparent 45%),
    linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}

nav{
  position:sticky; top:12px; z-index:100;
  display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px;
  margin:0 auto; padding:10px 20px;
  width:max-content; max-width:95%;
  background:rgba(5,5,15,0.85);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:50px;
  box-shadow:0 0 25px rgba(0,240,255,0.15);
}
.utility-chip{
  display:inline-flex; align-items:center; gap:6px;
  color:var(--text); font-weight:700; font-size:0.85rem;
  cursor:pointer; transition:0.3s; font-family:'Orbitron', sans-serif;
  background:none; border:none;
}
.utility-chip:hover{ color:var(--accent); text-shadow:0 0 10px var(--accent); }
.language-label{ display:flex; align-items:center; gap:5px; font-weight:700; font-size:0.85rem;}
#languageSelect{ background:transparent; color:var(--accent2); border:none; font-family:'Orbitron', sans-serif; font-weight:700; cursor:pointer; outline:none; }
#languageSelect option { background:var(--bg); }

header{
  text-align:center; padding:50px 20px 30px;
  position:relative;
}
header h1{
  font-family:'Orbitron', sans-serif;
  font-size:clamp(2.2rem, 6vw, 3.8rem);
  font-weight:900;
  background:linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
  -webkit-background-clip:text; color:transparent;
  margin-bottom:8px;
  filter:drop-shadow(0 0 25px rgba(255,0,127,0.4));
  text-transform:uppercase;
  letter-spacing:3px;
}
header p{ color:var(--muted); font-size:1.05rem; font-weight:700;}

.ad-slot { display: flex; justify-content: center; margin: 12px 0; min-height: 50px; overflow: hidden; }

.search{ max-width:580px; margin:0 auto 18px; padding:0 20px;}
.search input{
  width:100%; padding:14px 22px;
  border-radius:14px;
  border:1px solid var(--accent2);
  background:rgba(0,0,0,0.55); color:var(--text);
  font-size:1.05rem; font-family:inherit; font-weight:700;
  outline:none; transition:0.3s;
  box-shadow:0 0 12px rgba(0,240,255,0.15) inset;
}
.search input:focus{ box-shadow:0 0 25px rgba(0,240,255,0.4), 0 0 12px rgba(0,240,255,0.25) inset; border-color:var(--accent); }

.categories{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 15px; margin-bottom:30px;}
.cat{
  border:1px solid var(--border); background:transparent; color:var(--accent2);
  border-radius:10px; padding:9px 16px; font-weight:700; font-family:'Orbitron', sans-serif; cursor:pointer; transition:0.3s;
  text-transform:uppercase; font-size:0.8rem;
}
.cat:hover, .cat.active{
  background:var(--accent2); color:#000; border-color:var(--accent2);
  box-shadow:0 0 18px var(--accent2); transform:scale(1.06);
}

.container{ max-width:1200px; margin:auto; padding:0 15px 40px;}
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:16px;}
.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:18px;
  position:relative; overflow:hidden;
  backdrop-filter:blur(12px);
  transition:0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display:flex; flex-direction:column; justify-content:space-between;
}
.card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:var(--accent);
  box-shadow:0 10px 35px rgba(255,0,127,0.25);
}
.card::before{
  content:""; position:absolute; top:0; left:0; width:100%; height:3px;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  opacity:0; transition:0.35s;
}
.card:hover::before{ opacity:1; }
.card h3{ font-family:'Cairo', sans-serif; font-size:1.05rem; margin-bottom:6px; font-weight:900; color:var(--accent2);}
.card p{ color:var(--muted); font-size:0.85rem; margin-bottom:16px; flex-grow:1; font-weight:600;}

.btn{
  width:100%; border:none; border-radius:10px;
  padding:11px; background:transparent;
  color:var(--accent);
  border: 1.5px solid var(--accent);
  font-weight:700; font-family:'Cairo', sans-serif; font-size:0.9rem;
  cursor:pointer; transition:0.3s; text-align:center;
}
.btn:hover{ background:var(--accent); color:#fff; box-shadow:0 0 18px var(--accent); }
.btn.secondary{ background:transparent; color:var(--accent2); border-color:var(--accent2); }
.btn.secondary:hover{ background:var(--accent2); color:#000; box-shadow:0 0 18px var(--accent2); }

.section{
  max-width:800px; margin:20px auto;
  background:var(--card); backdrop-filter:blur(12px);
  border:1px solid var(--border); border-radius:14px; padding:28px;
}
.section h2{ color:var(--accent2); margin-bottom:12px; font-size:1.4rem; font-family:'Cairo', sans-serif;}
.section p{ color:var(--muted); font-weight:600;}

.rating-form { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:12px;}
.rating-stars { display:flex; gap:10px; font-size:2rem; cursor:pointer; color:#444; }
.rating-stars span { transition:0.2s; }
.rating-stars span:hover, .rating-stars span.selected { color:var(--warning); text-shadow:0 0 15px var(--warning); transform:scale(1.15); }
.rating-form input, .rating-form textarea { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:#111; color:#fff; font-family:inherit; max-width:400px;}

footer{ text-align:center; padding:35px 20px; border-top:1px solid var(--border); color:var(--muted); font-weight:700;}

.modal{ display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.92); backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:12px;}
.modal.open{ display:flex; }
.modal-content{
  width:min(560px, 100%); max-height:94vh; overflow:auto;
  background:linear-gradient(180deg, #0a0a12 0%, #050508 100%);
  border:1px solid var(--accent2); border-radius:16px;
  padding:18px; box-shadow:0 0 60px rgba(0,240,255,0.2);
  position:relative;
}
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.modal-head h2{ color:var(--accent2); margin:0; font-size:1.4rem; font-family:'Cairo', sans-serif; font-weight:900;}
.close{ font-size:1.8rem; background:none; border:none; color:var(--muted); cursor:pointer; transition:0.2s; line-height:1;}
.close:hover{ color:var(--accent); text-shadow:0 0 12px var(--accent);}

.game-area{
  background:linear-gradient(180deg, #0d0d15, #000);
  border:1px solid #222;
  border-radius:12px;
  min-height:260px;
  padding:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center;
  position:relative;
  overflow:hidden;
}
.status{
  color:var(--accent2);
  font-weight:800;
  font-size:1.15rem;
  text-shadow:0 0 12px rgba(0,240,255,0.4);
  min-height:1.5em;
}
.game-area canvas{
  max-width:100%;
  border-radius:8px;
  border:1px solid #333;
  touch-action:none;
  box-shadow:0 0 20px rgba(0,240,255,0.1);
}
.game-area input, .game-area select{
  padding:11px 14px; border-radius:8px; border:1px solid #333;
  background:#111; color:white; font-family:inherit; font-size:1rem;
  width:min(280px, 90%);
}

.game-controls{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:12px;}

/* === إصلاح اتجاه الأسهم === */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 58px);
  gap: 8px;
  margin: 12px auto;
  justify-content: center;
  direction: ltr; /* إصلاح اتجاه الأسهم */
}
.dpad button {
  background: linear-gradient(145deg, #1a1a28, #12121c);
  color: #fff;
  border: 2px solid var(--accent3);
  border-radius: 12px;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.15s;
  box-shadow: 0 4px 0 #3a2a8a, 0 0 15px rgba(124,92,255,0.2);
}
.dpad button:active {
  background: var(--accent3);
  transform: translateY(3px);
  box-shadow: 0 1px 0 #3a2a8a;
}
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 1; grid-row: 2; }   /* إصلاح اليسار */
.dpad .down { grid-column: 2; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }  /* إصلاح اليمين */

.modal-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
.modal-actions .btn { width: auto; padding: 10px 22px; font-family: 'Orbitron', sans-serif; font-size:0.85rem;}

/* === Auth Styles === */
.auth-buttons{ display:flex; gap:8px; align-items:center; }
.auth-buttons .utility-chip{ padding:4px 12px; border:1px solid var(--border); border-radius:20px; font-size:0.75rem; }
.auth-buttons .utility-chip:hover{ border-color:var(--accent2); background:rgba(0,240,255,0.1); }
.user-info{ display:flex; align-items:center; gap:6px; color:var(--success); font-weight:700; font-size:0.85rem; }

/* Auth Modal */
.auth-modal{
  display:none; position:fixed; inset:0; z-index:2000;
  background:rgba(0,0,0,0.95); backdrop-filter:blur(12px);
  align-items:center; justify-content:center; padding:16px;
}
.auth-modal.open{ display:flex; }
.auth-card{
  width:min(420px, 100%);
  background:linear-gradient(160deg, #0a0a18 0%, #050510 100%);
  border:1px solid var(--accent2); border-radius:20px;
  padding:32px 28px;
  box-shadow:0 0 60px rgba(0,240,255,0.25);
  position:relative;
  animation:authSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes authSlide{ from{opacity:0; transform:scale(0.9) translateY(20px);} to{opacity:1; transform:scale(1) translateY(0);} }
.auth-card .close-auth{
  position:absolute; top:14px; left:14px;
  font-size:1.8rem; background:none; border:none; color:var(--muted); cursor:pointer; line-height:1;
}
.auth-card .close-auth:hover{ color:var(--accent); }
.auth-card h2{
  font-family:'Orbitron', sans-serif; font-size:1.5rem; text-align:center; margin-bottom:6px;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip:text; color:transparent; font-weight:900;
}
.auth-card .auth-sub{ text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:22px; font-weight:600;}
.auth-form{ display:flex; flex-direction:column; gap:12px; }
.auth-form .auth-field{ display:flex; flex-direction:column; gap:4px; }
.auth-form label{ font-size:0.8rem; color:var(--accent2); font-weight:700; font-family:'Orbitron', sans-serif; letter-spacing:0.5px; }
.auth-form input{
  padding:12px 16px; border-radius:10px; border:1px solid var(--border);
  background:#111; color:#fff; font-family:inherit; font-size:0.95rem; font-weight:600;
  outline:none; transition:0.3s;
}
.auth-form input:focus{ border-color:var(--accent2); box-shadow:0 0 18px rgba(0,240,255,0.3); }
.auth-form .auth-submit{
  margin-top:8px; padding:13px; border-radius:10px; border:none;
  background:linear-gradient(135deg, var(--accent), var(--accent3));
  color:#fff; font-family:'Orbitron', sans-serif; font-weight:900; font-size:0.95rem;
  cursor:pointer; transition:0.3s; letter-spacing:1px;
}
.auth-form .auth-submit:hover{ box-shadow:0 0 25px rgba(255,0,127,0.5); transform:translateY(-2px); }
.auth-switch{ text-align:center; margin-top:16px; font-size:0.85rem; color:var(--muted); font-weight:600;}
.auth-switch a{ color:var(--accent2); cursor:pointer; text-decoration:none; font-weight:700; }
.auth-switch a:hover{ text-shadow:0 0 10px var(--accent2); }
.auth-msg{ text-align:center; font-size:0.85rem; font-weight:700; min-height:1.2em; margin-top:6px;}
.auth-msg.success{ color:var(--success); }
.auth-msg.error{ color:var(--danger); }
.auth-divider{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:0.75rem; margin:4px 0;}
.auth-divider::before, .auth-divider::after{ content:""; flex:1; height:1px; background:var(--border); }
.auth-guest{ text-align:center; color:var(--muted); font-size:0.8rem; font-weight:600; cursor:pointer; text-decoration:underline; }
.auth-guest:hover{ color:var(--accent2); }

@media(max-width:600px){
  nav{ width:95%; gap:8px; padding:8px 12px;}
  .utility-chip{ font-size:0.72rem; }
  .auth-buttons .utility-chip{ font-size:0.65rem; padding:3px 9px; }
  header{ padding:35px 12px 18px;}
  .grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
  .card{ padding: 14px; }
  .card h3{ font-size: 0.92rem; }
  .card p{ font-size: 0.72rem; margin-bottom: 10px; }
  .btn{ padding: 9px; font-size: 0.8rem; }
  .modal-content { padding: 14px; }
  .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); }
  .auth-card{ padding:24px 20px; }
}
</style>
</head>

<nav id="mainNav">
  <label class="language-label" for="languageSelect">🌐 <select id="languageSelect"><option value="ar">العربية</option><option value="en">English</option><option value="am">አማርኛ</option></select></label>

<script>
// ===== Utilities =====
function updateSiteTime(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}
updateSiteTime(); setInterval(updateSiteTime, 1000);
document.getElementById('year').textContent = new Date().getFullYear();

// ===== Auth System =====
const AUTH_KEY = 'gz_user';

function getUsers(){
  try { return JSON.parse(localStorage.getItem('gz_users') || '{}'); } catch(e){ return {}; }
}
function saveUsers(users){ localStorage.setItem('gz_users', JSON.stringify(users)); }
function getCurrentUser(){
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e){ return null; }
}
function setCurrentUser(user){
  if(user) localStorage.setItem(AUTH_KEY, JSON.stringify(user));
  else localStorage.removeItem(AUTH_KEY);
  updateAuthUI();
}

function updateAuthUI(){
  const user = getCurrentUser();
  const authButtons = document.getElementById('authButtons');
  const userInfo = document.getElementById('userInfo');
  const welcomeUser = document.getElementById('welcomeUser');
  if(user && user.email){
    authButtons.style.display = 'none';
    userInfo.style.display = 'flex';
    welcomeUser.textContent = '👤 ' + (user.name || user.email.split('@')[0]);

const authModal = document.getElementById('authModal');
const authTitle = document.getElementById('authTitle');
const authSub = document.getElementById('authSub');
const authForm = document.getElementById('authForm');
const authMsg = document.getElementById('authMsg');
const authName = document.getElementById('authName');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authConfirm = document.getElementById('authConfirm');
const nameField = document.getElementById('nameField');
const confirmField = document.getElementById('confirmField');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authSwitch = document.getElementById('authSwitch');
const switchToSignup = document.getElementById('switchToSignup');
const guestPlay = document.getElementById('guestPlay');

let authMode = 'login'; // 'login' or 'signup'

function openAuth(mode){
  authMode = mode;
  authModal.classList.add('open');
  authMsg.textContent = '';
  authMsg.className = 'auth-msg';
  authForm.reset();
  if(mode === 'signup'){
    authTitle.textContent = 'إنشاء حساب جديد';
    authSub.textContent = 'انضم إلينا وابدأ اللعب';
    nameField.style.display = 'flex';
    confirmField.style.display = 'flex';
    authSubmitBtn.textContent = 'إنشاء حساب';
    authSwitch.innerHTML = 'لديك حساب بالفعل؟ <a id="switchToLogin">تسجيل الدخول</a>';
    document.getElementById('switchToLogin').onclick = () => openAuth('login');
  } else {
    authTitle.textContent = 'تسجيل الدخول';
    authSub.textContent = 'أدخل بياناتك للوصول إلى حسابك';
    nameField.style.display = 'none';
    confirmField.style.display = 'none';
    authSubmitBtn.textContent = 'دخول';
    authSwitch.innerHTML = 'ليس لديك حساب؟ <a id="switchToSignup">إنشاء حساب</a>';
    document.getElementById('switchToSignup').onclick = () => openAuth('signup');
  }
  setTimeout(() => authEmail.focus(), 100);
}

function closeAuth(){ authModal.classList.remove('open'); }

document.getElementById('loginBtn').onclick = () => openAuth('login');
document.getElementById('signupBtn').onclick = () => openAuth('signup');
document.getElementById('closeAuth').onclick = closeAuth;
authModal.addEventListener('click', e => { if(e.target === authModal) closeAuth(); });
guestPlay.onclick = () => { closeAuth(); };

document.getElementById('logoutBtn').onclick = () => {
  setCurrentUser(null);
  authMsg.textContent = '';
};

authForm.addEventListener('submit', e => {
  e.preventDefault();
  authMsg.textContent = '';
  authMsg.className = 'auth-msg';

  const email = authEmail.value.trim().toLowerCase();
  const password = authPassword.value;

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    authMsg.textContent = '⚠️ البريد الإلكتروني غير صالح';
    authMsg.classList.add('error');
    return;
  }
  if(password.length < 6){
    authMsg.textContent = '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
    authMsg.classList.add('error');
    return;
  }

  const users = getUsers();

  if(authMode === 'signup'){
    const name = authName.value.trim();
    if(!name){
      authMsg.textContent = '⚠️ الرجاء إدخال الاسم';
      authMsg.classList.add('error');
      return;
    }
    if(users[email]){
      authMsg.textContent = '⚠️ هذا البريد مسجل بالفعل، جرب تسجيل الدخول';
      authMsg.classList.add('error');
      return;
    }
    if(authConfirm.value !== password){
      authMsg.textContent = '⚠️ كلمتا المرور غير متطابقتين';
      authMsg.classList.add('error');
      return;
    }
    // Simple hash (demo only — in real apps use server-side hashing)
    const hash = btoa(unescape(encodeURIComponent(email + ':' + password)));
    users[email] = { name, email, hash, created: Date.now() };
    saveUsers(users);
    setCurrentUser({ name, email });
    authMsg.textContent = '🎉 تم إنشاء الحساب بنجاح! مرحباً ' + name;
    authMsg.classList.add('success');
    setTimeout(closeAuth, 1400);
  } else {
    const user = users[email];
    const hash = btoa(unescape(encodeURIComponent(email + ':' + password)));
    if(!user || user.hash !== hash){
      authMsg.textContent = '❌ بيانات الدخول غير صحيحة';
      authMsg.classList.add('error');
      return;
    }
    setCurrentUser({ name: user.name, email: user.email });
    authMsg.textContent = '✅ تم تسجيل الدخول! مرحباً ' + user.name;
    authMsg.classList.add('success');
    setTimeout(closeAuth, 1200);
  }
});

function setLanguage(lang) {
  const tr = translations[lang] || translations.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  
  document.getElementById('subtitleText').textContent = tr.subtitle;
  document.getElementById('search').placeholder = tr.search;
  
  const cats = document.querySelectorAll('.cat');
  if(cats[0]) cats[0].textContent = tr.all;
  if(cats[1]) cats[1].textContent = tr.arcade;
  if(cats[2]) cats[2].textContent = tr.puzzle;
  if(cats[3]) cats[3].textContent = tr.classic;
  if(cats[4]) cats[4].textContent = tr.action;
  
  document.getElementById('rateTitle').textContent = tr.rateTitle;
  document.getElementById('rateDesc').textContent = tr.rateDesc;
  document.getElementById('rateName').placeholder = tr.namePh;
  document.getElementById('rateMsg').placeholder = tr.msgPh;
  document.getElementById('rateSubmitBtn').textContent = tr.submitRate;
  
  document.getElementById('restartCurrentGame').textContent = tr.restart;
  document.getElementById('closeCurrentGame').textContent = tr.close;
  
  document.getElementById('themeToggle').textContent = lightTheme ? tr.themeLight : tr.theme;
  document.getElementById('fullscreenBtn').textContent = tr.fullscreen;
  document.getElementById('loginBtn').textContent = tr.login;
  document.getElementById('signupBtn').textContent = tr.signup;
  document.getElementById('logoutBtn').textContent = tr.logout;
  
  document.getElementById('footerText').innerHTML = 
    `© <span id="year">${new Date().getFullYear()}</span> GameZone40. ${tr.rights}<br>
    📧 <a href="mailto:alarmedali996@gmail.com" style="color:var(--accent2);text-decoration:none;">alarmedali996@gmail.com</a>`;
  
  render();
  if(modal.classList.contains('open') && currentGameId){
    openGame(currentGameId);
  }
}

let selectedRating = 0;
document.querySelectorAll('#stars span').forEach(s => {
  s.addEventListener('click', () => {
    selectedRating = parseInt(s.dataset.val);
    document.querySelectorAll('#stars span').forEach(star => {
      star.classList.toggle('selected', parseInt(star.dataset.val) <= selectedRating);
    });
    document.getElementById('ratingValue').value = selectedRating;
  });
});

document.getElementById('ratingForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const lang = document.getElementById('languageSelect').value;
  const tr = translations[lang] || translations.ar;
  
  if(selectedRating === 0) {
    document.getElementById('rateFeedback').innerHTML = tr.pickStars;
    document.getElementById('rateFeedback').style.color = '#ff4757';
    return;
  }
  
  document.getElementById('ratingValue').value = selectedRating;
  const btn = document.getElementById('rateSubmitBtn');
  const originalText = tr.submitRate;
  btn.disabled = true;
  btn.textContent = tr.sending;
  
  try {
    const formData = new FormData(this);
    const response = await fetch(this.action, {
      method: 'POST', body: formData, headers: { 'Accept': 'application/json' }
    });
    
    if(response.ok) {
      document.getElementById('rateFeedback').innerHTML = tr.congratsRate;
      document.getElementById('rateFeedback').style.color = '#00d4aa';
      this.reset();
      selectedRating = 0;
      document.querySelectorAll('#stars span').forEach(star => star.classList.remove('selected'));
    } else throw new Error('fail');
  } catch(err) {
    document.getElementById('rateFeedback').textContent = tr.errorMsg;
    document.getElementById('rateFeedback').style.color = '#ff4757';
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

const grid = document.getElementById('grid'), search = document.getElementById('search');
let category = 'all', cleanups = [];

function render(){
  grid.innerHTML='';
  const q = search.value.toLowerCase();
  const lang = document.getElementById('languageSelect')?.value || 'ar';
  const localizedGames = getLocalizedGames(lang);
  const tr = translations[lang] || translations.ar;
  
  const list = localizedGames.filter(g =>
    (category === 'all' || g.cat === category) && 
    (!q || (g.name + ' ' + g.desc).toLowerCase().includes(q))
  );
  
  list.forEach(g => {
    const c = document.createElement('article');
    c.className = 'card';
    c.innerHTML = `<div><h3>${g.id}. ${g.name}</h3><p>${g.desc}</p></div><button class="btn">${tr.play}</button>`;
    c.querySelector('button').onclick = () => openGame(g.id);
    grid.appendChild(c);
  });
}

search.addEventListener('input', render);

  document.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));

});

function simulateKey(key){ if(document.onkeydown) document.onkeydown({key:key, preventDefault:()=>{}}); }
function addDpad(controls, keys){
  const dpad = document.createElement('div'); dpad.className = 'dpad';
  if(keys.includes('ArrowUp')){ const b = document.createElement('button'); b.className='up'; b.textContent='↑'; b.onclick=()=>simulateKey('ArrowUp'); dpad.appendChild(b); }
  if(keys.includes('ArrowLeft')){ const b = document.createElement('button'); b.className='left'; b.textContent='←'; b.onclick=()=>simulateKey('ArrowLeft'); dpad.appendChild(b); }
  if(keys.includes('ArrowDown')){ const b = document.createElement('button'); b.className='down'; b.textContent='↓'; b.onclick=()=>simulateKey('ArrowDown'); dpad.appendChild(b); }
  if(keys.includes('ArrowRight')){ const b = document.createElement('button'); b.className='right'; b.textContent='→'; b.onclick=()=>simulateKey('ArrowRight'); dpad.appendChild(b); }
  if(keys.includes('Space')){ const b = document.createElement('button'); b.className='action'; b.style.gridColumn='1'; b.style.gridRow='1'; b.textContent='🚀'; b.onclick=()=>simulateKey(' '); dpad.appendChild(b); }
  controls.appendChild(dpad);
}

function snake(){
  let s = status(`🟢 ${t('easy')} | ${t('score')}: 0`);
  const c = canvas(300,300), x = c.getContext('2d');
  let body = [{x:8,y:8},{x:7,y:8},{x:6,y:8}], dx=1, dy=0, food={x:14,y:10}, score=0, dead=false;
  const size = 15;
  let speed = 180, level = t('easy'), levelColor = '#00d4aa';
  let timer = null;
  function getLevel(){
    if(score>=20){ speed=90; level=t('hard'); levelColor='#ff4757'; }
    else if(score>=8){ speed=130; level=t('medium'); levelColor='#ffd700'; }
    else { speed=180; level=t('easy'); levelColor='#00d4aa'; }
  }
  function updateStatus(){
    s.innerHTML = `<span style="color:${levelColor}">● ${level}</span> | ${t('score')}: ${score}`;
  }
  function draw(){
    const g = x.createLinearGradient(0,0,300,300);
    g.addColorStop(0,'#0a0a18'); g.addColorStop(1,'#030308');
    x.fillStyle = g; x.fillRect(0,0,300,300);
    x.strokeStyle='rgba(0,240,255,0.05)'; x.lineWidth=1;
    for(let i=0;i<=20;i++){
      x.beginPath(); x.moveTo(i*size,0); x.lineTo(i*size,300); x.stroke();
      x.beginPath(); x.moveTo(0,i*size); x.lineTo(300,i*size); x.stroke();
    }
    body.forEach((p,i)=>{
      const cx=p.x*size+size/2, cy=p.y*size+size/2;
      const isHead = i===0;
      const radius = isHead?7.5:Math.max(4.5,6.8-(i/body.length)*2.2);
      if(isHead){ x.shadowColor='#00f0ff'; x.shadowBlur=16; } else x.shadowBlur=0;
      const gradient = x.createRadialGradient(cx-2,cy-2,1,cx,cy,radius);
      if(isHead){ gradient.addColorStop(0,'#a0ffff'); gradient.addColorStop(0.55,'#00e8ff'); gradient.addColorStop(1,'#0088bb'); }
      else { const tt=i/Math.max(body.length,1); gradient.addColorStop(0,`rgba(0,${230-tt*90},${255-tt*70},0.95)`); gradient.addColorStop(1,`rgba(0,${150-tt*70},${210-tt*90},0.9)`); }
      x.fillStyle = gradient; x.beginPath(); x.arc(cx,cy,radius,0,7); x.fill();
      if(isHead){
        x.shadowBlur=0; let ox=0,oy=0;
        if(dx===1)ox=2.5; else if(dx===-1)ox=-2.5; else if(dy===-1)oy=-2.5; else if(dy===1)oy=2.5;
        x.fillStyle='#fff'; x.beginPath(); x.arc(cx-2.8+ox*0.6,cy-2.2+oy*0.6,1.9,0,7); x.fill();
        x.beginPath(); x.arc(cx+2.8+ox*0.6,cy-2.2+oy*0.6,1.9,0,7); x.fill();
        x.fillStyle='#001820'; x.beginPath(); x.arc(cx-2.8+ox,cy-2.2+oy,0.95,0,7); x.fill();
        x.beginPath(); x.arc(cx+2.8+ox,cy-2.2+oy,0.95,0,7); x.fill();
      }
    });
    const fx=food.x*size+size/2, fy=food.y*size+size/2;
    x.shadowColor='#ff007f'; x.shadowBlur=18;
    const appleGrad = x.createRadialGradient(fx-2,fy-2,1,fx,fy,7);
    appleGrad.addColorStop(0,'#ff8fb3'); appleGrad.addColorStop(0.65,'#ff007f'); appleGrad.addColorStop(1,'#bb0044');
    x.fillStyle = appleGrad; x.beginPath(); x.arc(fx,fy,6.8,0,7); x.fill();
    x.shadowBlur = 0;
  }
  function step(){
    if(dead) return;
    let h = {x:body[0].x+dx, y:body[0].y+dy};
    if(h.x<0||h.x>=20||h.y<0||h.y>=20){
      dead=true; s.innerHTML=`💀 <b>${t('gameOver')}</b> — ${t('score')}: ${score}`; s.style.color='#ff4757'; return;
    }
    if(body.some(p=>p.x===h.x&&p.y===h.y)){
      dead=true; s.innerHTML=`💀 <b>${t('gameOver')}</b> — ${t('score')}: ${score}`; s.style.color='#ff4757'; return;
    }
    body.unshift(h);
    if(h.x===food.x&&h.y===food.y){
      score++; getLevel(); updateStatus();
      clearInterval(timer);
      timer = setInterval(step, speed);
      cleanups.push(()=>clearInterval(timer));
      do { food = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}; }
      while(body.some(p=>p.x===food.x&&p.y===food.y));
    } else body.pop();
    draw();
  }
  document.onkeydown = e => {
    if(dead) return;
    const k = e.key;
    if(k==='ArrowUp'&&dy!==1){ dx=0; dy=-1; }
    else if(k==='ArrowDown'&&dy!==-1){ dx=0; dy=1; }
    else if(k==='ArrowLeft'&&dx!==1){ dx=-1; dy=0; }
    else if(k==='ArrowRight'&&dx!==-1){ dx=1; dy=0; }
    else return;
    e.preventDefault();
  };
  cleanups.push(()=>document.onkeydown=null);
  timer = setInterval(step, speed);
  cleanups.push(()=>clearInterval(timer));
  addDpad(controls, ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  draw();
}

function game2048(){
  let board = Array(16).fill(0), s = status(`${t('score')}: 0`), score = 0;
  const c = canvas(300,300), ctx = c.getContext('2d');
  const colors = {2:'#1a1a3e',4:'#2a2a5e',8:'#3a2a7e',16:'#4a2a9e',32:'#5a2abe',64:'#6a2ade',128:'#7c5cff',256:'#00f0ff',512:'#00d4aa',1024:'#ffd700',2048:'#ff007f'};
  function add(){
    let a = board.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(a.length) board[a[Math.random()*a.length|0]] = Math.random()<.9?2:4;
  }
  function draw(){
    ctx.fillStyle = '#0a0a15'; ctx.fillRect(0,0,300,300);
    board.forEach((v,i)=>{
      let x = i%4*75, y = (i/4|0)*75;
      ctx.fillStyle = v?(colors[v]||'#ff007f'):'#151525';
      ctx.beginPath(); ctx.roundRect(x+4,y+4,67,67,10); ctx.fill();
      if(v){
        ctx.fillStyle = 'white';
        ctx.font = v>100?'bold 20px Cairo':'bold 26px Cairo';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(v, x+37.5, y+37.5);
      }
    });
  }
  function move(dir){
    let changed = false;
    for(let r=0;r<4;r++){
      let ids = Array.from({length:4},(_,i)=>dir==='left'?r*4+i:dir==='right'?r*4+3-i:dir==='up'?i*4+r:(3-i)*4+r);
      let a = ids.map(i=>board[i]).filter(Boolean), out = [];
      for(let i=0;i<a.length;i++){
        if(a[i]===a[i+1]){ out.push(a[i]*2); score += a[i]*2; i++; }
        else out.push(a[i]);
      }
      while(out.length<4) out.push(0);
      ids.forEach((id,i)=>{ if(board[id]!==out[i]) changed=true; board[id]=out[i]; });
    }
    if(changed){ add(); s.textContent = `${t('score')}: ${score}`; draw(); }
  }
  document.onkeydown = e => {
    let d = {'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'}[e.key];
    if(d){ e.preventDefault(); move(d); }
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls, ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  add(); add(); draw();
}

function guess(){

  let seq = [], userSeq = [], level = 1, showing = true;
  function nextLevel() {
    showing = true; userSeq = []; seq = [];
    for(let i=0; i<level+2; i++) seq.push(Math.floor(Math.random()*9)+1);

function connect4(){
  let b = Array(42).fill(0), turn = 1, s = status(t('turn')+': 🔴');
  const wrap = el('div');
  wrap.style.cssText = 'display:grid;grid-template-columns:repeat(7,40px);gap:4px;';
  area.appendChild(wrap);
  function win(i){
    let r = i/7|0, c = i%7;
    for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
      let n = 1;
      for(let k of [-1,1]){
        let rr = r+dr*k, cc = c+dc*k;
        while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr*7+cc]===turn){ n++; rr+=dr*k; cc+=dc*k; }
      }
      if(n>=4) return true;
    }
    return false;
  }
  for(let i=0;i<42;i++){
    let bt = button('·', ()=>{
      let col = i%7, row = 5;
      while(row>=0&&b[row*7+col]) row--;
      if(row<0) return;
      let ix = row*7+col;
      b[ix] = turn;
      wrap.children[ix].textContent = turn===1?'🔴':'🟡';
      wrap.children[ix].style.fontSize = '1.4rem';
      if(win(ix)){ s.innerHTML = `🎉 ${t('youWon')}`; wrap.querySelectorAll('button').forEach(x=>x.disabled=true); }
      else { turn = 3-turn; s.textContent = t('turn')+': '+(turn===1?'🔴':'🟡'); }
    }, 'btn secondary');
    bt.style.cssText = 'width:40px;height:40px;padding:0;border-radius:50%;font-size:1.2rem;';
    wrap.appendChild(bt);
  }
}

    ctx.fillStyle = '#333'; ctx.fillRect(0, 180, 300, 20);
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.roundRect(40, playerY, 30, 30, 5); ctx.fill();
    obstacles.forEach(o => { ctx.fillStyle = '#ff4757'; ctx.fillRect(o.x, 160, 20, 20); });
    if(!over) {
      frame++;
      velocity += 0.6; playerY += velocity;
      if(playerY > 150) { playerY = 150; jumping = false; velocity = 0; }
      if(frame % 60 === 0) obstacles.push({x: 300});
      obstacles.forEach(o => {
        o.x -= speed;
        if(o.x < 70 && o.x > 30 && playerY > 130) { over = true; }
        if(o.x === 40) { score++; s.textContent = `🏃 ${t('score')}: ${score}`; }
      });
      obstacles = obstacles.filter(o => o.x > -20);
      if(score >= 10) speed = 6;
      if(score >= 20) speed = 8;
      if(over) { s.innerHTML = `🎉 ${t('youWon')}<br>${t('score')}: ${score}`; s.style.color = '#00d4aa'; }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

  function draw(){

      frame++;

      rocks.forEach(r=>{
        r.y += 2.6;

        ctx.beginPath(); ctx.roundRect(r.x,r.y,18,18,4); ctx.fill();

function wordChain(){
  let s = status(`🎯 ${t('target')}: ...`);
  const c = canvas(300, 280), ctx = c.getContext('2d');
  let score = 0, timeLeft = 20, over = false, targetColor = '';
  let blockColors = [];
  const colorNames = { ar: ['أحمر', 'أزرق', 'أخضر', 'أصفر'], en: ['Red', 'Blue', 'Green', 'Yellow'], am: ['ቀይ', 'ሰማያዊ', 'አረንጓዴ', 'ቢጫ'] };
  const lang = document.getElementById('languageSelect').value;
  const names = colorNames[lang] || colorNames.ar;
  const hexColors = ['#ff4757', '#1e90ff', '#2ed573', '#ffd700'];

  function newRound() {
    targetColor = hexColors[Math.floor(Math.random() * 4)];
    const targetIndex = hexColors.indexOf(targetColor);
    s.innerHTML = `🎯 ${t('target')}: <span style="color:${targetColor}; font-weight:900;">${names[targetIndex]}</span> | ${t('score')}: ${score} | ${t('time')}: ${timeLeft}`;
    s.style.color = 'var(--accent2)';
    blockColors = [];
    let shuffledColors = [...hexColors].sort(() => Math.random() - 0.5);
    for (let i = 0; i < 4; i++) {
      blockColors.push({ color: shuffledColors[i], x: (i % 2) * 150, y: Math.floor(i / 2) * 140, w: 150, h: 140 });
    }
  }

  c.onclick = (e) => {
    if (over) return;
    const rect = c.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (c.width / rect.width);
    const my = (e.clientY - rect.top) * (c.height / rect.height);
    for (let b of blockColors) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        if (b.color === targetColor) { score += 10; newRound(); } 
        else { timeLeft -= 2; if (timeLeft < 0) timeLeft = 0; }
        break;
      }
    }
  };

  startInterval(() => {
    if (over) return;
    timeLeft--;
    if (timeLeft <= 0) { over = true; s.innerHTML = `🎉 ${t('youWon')}<br>${t('score')}: ${score}`; s.style.color = '#00d4aa'; } 
    else {
      const targetIndex = hexColors.indexOf(targetColor);
      s.innerHTML = `🎯 ${t('target')}: <span style="color:${targetColor}; font-weight:900;">${names[targetIndex]}</span> | ${t('score')}: ${score} | ${t('time')}: ${timeLeft}`;
    }
  }, 1000);

  function draw() {
    ctx.fillStyle = '#0a0a15'; ctx.fillRect(0, 0, 300, 280);
    blockColors.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10); });
    if (over) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 300, 280); }
    requestAnimationFrame(draw);
  }
  newRound(); draw();
}

function colorMemory(){
  let seq = [], i = 0, s = status(t('clickStart')), colors = ['🟥','🟩','🟦','🟨'];
  controls.appendChild(button(t('start'), ()=>{
    seq.push(Math.random()*4|0); i = 0;

    if(i===seq.length){
      s.textContent = `${t('correct')}! 🎉`;
      setTimeout(()=>{ seq.push(Math.random()*4|0); i=0; s.textContent = t('watch')+' '+seq.map(x=>colors[x]).join(' '); setTimeout(()=>s.textContent = t('repeat'), 1400); }, 600);
    }
  })));
}

function maze(){
  let x = 15, y = 15, s = status(t('clickStart')), c = canvas(280,280), ctx = c.getContext('2d');
  function draw(){
    ctx.fillStyle = '#0a0a15'; ctx.fillRect(0,0,280,280);
    ctx.fillStyle = '#7c5cff88';
    [[60,0,12,200],[120,80,12,200],[180,0,12,200]].forEach(a=>ctx.fillRect(...a));
    ctx.fillStyle = '#00d4aa';
    ctx.beginPath(); ctx.roundRect(240,240,30,30,6); ctx.fill();
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.arc(x+8,y+8,10,0,7); ctx.fill();
  }
  function move(dx,dy){
    x = Math.max(5, Math.min(255, x+dx));
    y = Math.max(5, Math.min(255, y+dy));
    if(x>230&&y>230) s.textContent = `${t('goal')}! 🎉`;
    draw();
  }
  document.onkeydown = e => {
    if(e.key==='ArrowUp') move(0,-12);
    if(e.key==='ArrowDown') move(0,12);
    if(e.key==='ArrowLeft') move(-12,0);
    if(e.key==='ArrowRight') move(12,0);
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls, ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  draw();
}

function ninja(){
  let x = 135, score = 0, frame = 0, over = false, s = status(`🟢 ${t('easy')} | ${t('dodged')}: 0`);
  const c = canvas(300,260), ctx = c.getContext('2d'), items = [];
  let spawnRate = 50, fallSpeed = 2.0;
  function getLevel(){
    if(score>=18){ spawnRate=22; fallSpeed=3.8; s.innerHTML = `🔴 <b>${t('hard')}</b> | ${t('dodged')}: ${score}`; }
    else if(score>=8){ spawnRate=35; fallSpeed=2.8; s.innerHTML = `🟡 <b>${t('medium')}</b> | ${t('dodged')}: ${score}`; }
    else { spawnRate=50; fallSpeed=2.0; s.innerHTML = `🟢 <b>${t('easy')}</b> | ${t('dodged')}: ${score}`; }
  }
  document.onkeydown = e => {
    if(e.key==='ArrowLeft') x = Math.max(0, x-20);
    if(e.key==='ArrowRight') x = Math.min(265, x+20);
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls, ['ArrowLeft','ArrowRight']);
  function draw(){
    const bg = ctx.createLinearGradient(0,0,0,260);
    bg.addColorStop(0,'#0a0a18'); bg.addColorStop(1,'#030308');
    ctx.fillStyle = bg; ctx.fillRect(0,0,300,260);
    ctx.shadowColor='#00f0ff'; ctx.shadowBlur=10;
    ctx.fillStyle='#00f0ff';
    ctx.beginPath(); ctx.roundRect(x,222,32,28,8); ctx.fill();
    ctx.shadowBlur = 0;
    if(!over){
      frame++;
      if(frame%spawnRate===0) items.push({x:Math.random()*270, y:-20});
      items.forEach(a=>{
        a.y += fallSpeed;
        ctx.fillStyle='#ff4757';
        ctx.shadowColor='#ff4757'; ctx.shadowBlur=6;
        ctx.beginPath(); ctx.roundRect(a.x,a.y,16,20,5); ctx.fill();
        ctx.shadowBlur = 0;
        if(a.y>205&&a.x>x-8&&a.x<x+32) over = true;
        if(a.y>270){ score++; getLevel(); }
      });
      items.length = 0; items.push(...items.filter(a=>a.y<280));
      if(over){ s.innerHTML = `💀 ${t('gameOver')} — ${t('score')}: ${score}`; s.style.color='#ff4757'; }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

function matchThree(){
  let shapes = ['🔴','🟢','🔵','🟡','🟣'];
  let board = Array.from({length:16}, ()=>shapes[Math.random()*5|0]), sel = -1, score = 0;
  let s = status(t('clickStart'));
  const wrap = el('div');
  wrap.style.cssText = 'display:grid;grid-template-columns:repeat(4,62px);gap:6px;';
  area.appendChild(wrap);
  function checkMatch(){
    for(let r=0;r<4;r++) for(let c=0;c<2;c++){
      let i = r*4+c;
      if(board[i]&&board[i]===board[i+1]&&board[i]===board[i+2]){
        board[i] = board[i+1] = board[i+2] = shapes[Math.random()*5|0];
        score += 30; return true;
      }
    }
    for(let c=0;c<4;c++) for(let r=0;r<2;r++){
      let i = r*4+c;
      if(board[i]&&board[i]===board[i+4]&&board[i]===board[i+8]){
        board[i] = board[i+4] = board[i+8] = shapes[Math.random()*5|0];
        score += 30; return true;
      }
    }
    return false;
  }
  function draw(){
    wrap.innerHTML = '';
    board.forEach((v,i)=>{
      let b = button(v, ()=>{
        if(sel<0){ sel = i; s.textContent = t('next'); }
        else {
          if(Math.abs(sel-i)===1||Math.abs(sel-i)===4){
            [board[sel],board[i]] = [board[i],board[sel]];
            if(checkMatch()) s.textContent = `${t('score')}: ${score}`;
            else s.textContent = t('tryAgain');
          }
          sel = -1; draw();
        }
      }, 'btn secondary');
      b.style.cssText = 'height:58px;font-size:1.6rem;border-radius:12px;'+(sel===i?'border-color:#00f0ff;box-shadow:0 0 14px #00f0ff;':'');
      wrap.appendChild(b);
    });
  }
  draw();
}

function shooter(){
  let x = 140, shots = [], enemies = [], score = 0, over = false, s = status(`🟢 ${t('easy')} | ${t('score')}: 0`);
  const c = canvas(300,300), ctx = c.getContext('2d');
  let spawnChance = 0.012, enemySpeed = 1.0;
  function getLevel(){
    if(score>=15){ spawnChance=0.035; enemySpeed=2.2; s.innerHTML = `🔴 <b>${t('hard')}</b> | ${t('score')}: ${score}`; }
    else if(score>=6){ spawnChance=0.022; enemySpeed=1.5; s.innerHTML = `🟡 <b>${t('medium')}</b> | ${t('score')}: ${score}`; }
    else { spawnChance=0.012; enemySpeed=1.0; s.innerHTML = `🟢 <b>${t('easy')}</b> | ${t('score')}: ${score}`; }
  }
  document.onkeydown = e => {
    if(e.key==='ArrowLeft') x = Math.max(5, x-16);
    if(e.key==='ArrowRight') x = Math.min(275, x+16);
    if(e.code==='Space') shots.push({x:x+8, y:255});
  };
  c.onclick = ()=>shots.push({x:x+8, y:255});
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls, ['ArrowLeft','ArrowRight','Space']);
  function draw(){
    const bg = ctx.createLinearGradient(0,0,0,300);
    bg.addColorStop(0,'#050515'); bg.addColorStop(1,'#020208');
    ctx.fillStyle = bg; ctx.fillRect(0,0,300,300);
    ctx.shadowColor='#00f0ff'; ctx.shadowBlur=12;
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();
    ctx.moveTo(x+12,260); ctx.lineTo(x,290); ctx.lineTo(x+24,290);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    if(!over){
      if(Math.random()<spawnChance) enemies.push({x:20+Math.random()*250, y:-10});
      shots.forEach(b=>{
        b.y -= 7;
        ctx.fillStyle='#fff';
        ctx.shadowColor='#00f0ff'; ctx.shadowBlur=6;
        ctx.fillRect(b.x,b.y,3,14);
        ctx.shadowBlur = 0;
      });
      enemies.forEach(e=>{
        e.y += enemySpeed;
        ctx.font = '22px serif';
        ctx.fillText('👾', e.x, e.y);
        if(e.y>275) over = true;
        shots.forEach(b=>{
          if(Math.abs(b.x-e.x)<20&&Math.abs(b.y-e.y)<20){
            e.y = 400; score++; getLevel();
          }
        });
      });
      shots = shots.filter(b=>b.y>0);
      enemies = enemies.filter(e=>e.y<330);
      if(over){ s.innerHTML = `💀 ${t('gameOver')} — ${t('score')}: ${score}`; s.style.color='#ff4757'; }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

function codeBreaker(){
  let code = String(Math.random()*1000|0).padStart(3,'0'), tries = 0, s = status(t('clickStart'));
  let i = input('000');
  controls.appendChild(button(t('submit'), ()=>{
    let v = i.value.padStart(3,'0');
    if(!/^\d{3}$/.test(v)) return s.textContent = '3 digits';
    tries++;
    let exact = [...v].filter((c,j)=>c===code[j]).length;
    let near = [...v].filter(c=>code.includes(c)).length-exact;
    s.innerHTML = exact===3?`🎉 ${t('youWon')} (${tries})`:`✓${exact} | ~${near}`;
  }));
}

function keepBalance(){
  let s = status(t('clickStart')), score = 0, over = false;
  const c = canvas(300,240), ctx = c.getContext('2d');
  let angle = 0, vel = 0;
  document.onkeydown = e => {
    if(e.key==='ArrowLeft') vel -= 0.12;
    if(e.key==='ArrowRight') vel += 0.12;
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls, ['ArrowLeft','ArrowRight']);
  function draw(){
    ctx.fillStyle = '#0a0a15'; ctx.fillRect(0,0,300,240);
    if(!over){
      vel *= 0.98;
      angle += vel;
      if(Math.abs(angle)>0.85){
        over = true;
        s.innerHTML = `💀 ${t('gameOver')} — ${t('score')}: ${Math.floor(score/10)}`;
        s.style.color = '#ff4757';
      } else {
        score++;
        if(score%30===0) s.textContent = `${t('balance')}: ${Math.floor(score/10)}`;
      }
    }
    ctx.fillStyle = '#333';
    ctx.fillRect(100,200,100,12);
    ctx.save();
    ctx.translate(150,200);
    ctx.rotate(angle);
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.roundRect(-6,-90,12,90,4); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-100,14,0,7); ctx.fill();
    ctx.restore();
    requestAnimationFrame(draw);
  }
  draw();
}
