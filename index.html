<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GameZone40 — تجربة سايبربانك جميلة وسهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030308;
  --card:rgba(18, 18, 30, 0.75);
  --accent:#ff007f;
  --accent2:#00f0ff;
  --accent3:#7c5cff;
  --text:#ffffff;
  --muted:#8892b0;
  --border:rgba(0, 240, 255, 0.25);
  --success:#00d4aa;
  --danger:#ff4757;
  --warning:#ffd700;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Cairo', system-ui, sans-serif;
  background-color:var(--bg);
  background-image: 
    radial-gradient(circle at 20% -10%, rgba(255,0,127,0.18), transparent 45%),
    radial-gradient(circle at 80% 110%, rgba(0,240,255,0.15), transparent 45%),
    linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}

nav{
  position:sticky; top:12px; z-index:100;
  display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px;
  margin:0 auto; padding:10px 20px;
  width:max-content; max-width:95%;
  background:rgba(5,5,15,0.85);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:50px;
  box-shadow:0 0 25px rgba(0,240,255,0.15);
}
.utility-chip{
  display:inline-flex; align-items:center; gap:6px;
  color:var(--text); font-weight:700; font-size:0.85rem;
  cursor:pointer; transition:0.3s; font-family:'Orbitron', sans-serif;
  background:none; border:none;
}
.utility-chip:hover{ color:var(--accent); text-shadow:0 0 10px var(--accent); }
.language-label{ display:flex; align-items:center; gap:5px; font-weight:700; font-size:0.85rem;}
#languageSelect{ background:transparent; color:var(--accent2); border:none; font-family:'Orbitron', sans-serif; font-weight:700; cursor:pointer; outline:none; }
#languageSelect option { background:var(--bg); }

header{
  text-align:center; padding:50px 20px 30px;
  position:relative;
}
header h1{
  font-family:'Orbitron', sans-serif;
  font-size:clamp(2.2rem, 6vw, 3.8rem);
  font-weight:900;
  background:linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
  -webkit-background-clip:text; color:transparent;
  margin-bottom:8px;
  filter:drop-shadow(0 0 25px rgba(255,0,127,0.4));
  text-transform:uppercase;
  letter-spacing:3px;
}
header p{ color:var(--muted); font-size:1.05rem; font-weight:700;}

.ad-slot { display: flex; justify-content: center; margin: 12px 0; min-height: 50px; overflow: hidden; }

.search{ max-width:580px; margin:0 auto 18px; padding:0 20px;}
.search input{
  width:100%; padding:14px 22px;
  border-radius:14px;
  border:1px solid var(--accent2);
  background:rgba(0,0,0,0.55); color:var(--text);
  font-size:1.05rem; font-family:inherit; font-weight:700;
  outline:none; transition:0.3s;
  box-shadow:0 0 12px rgba(0,240,255,0.15) inset;
}
.search input:focus{ box-shadow:0 0 25px rgba(0,240,255,0.4), 0 0 12px rgba(0,240,255,0.25) inset; border-color:var(--accent); }

.categories{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 15px; margin-bottom:30px;}
.cat{
  border:1px solid var(--border); background:transparent; color:var(--accent2);
  border-radius:10px; padding:9px 16px; font-weight:700; font-family:'Orbitron', sans-serif; cursor:pointer; transition:0.3s;
  text-transform:uppercase; font-size:0.8rem;
}
.cat:hover, .cat.active{
  background:var(--accent2); color:#000; border-color:var(--accent2);
  box-shadow:0 0 18px var(--accent2); transform:scale(1.06);
}

.container{ max-width:1200px; margin:auto; padding:0 15px 40px;}
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:16px;}
.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:18px;
  position:relative; overflow:hidden;
  backdrop-filter:blur(12px);
  transition:0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display:flex; flex-direction:column; justify-content:space-between;
}
.card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:var(--accent);
  box-shadow:0 10px 35px rgba(255,0,127,0.25);
}
.card::before{
  content:""; position:absolute; top:0; left:0; width:100%; height:3px;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  opacity:0; transition:0.35s;
}
.card:hover::before{ opacity:1; }
.card h3{ font-family:'Cairo', sans-serif; font-size:1.05rem; margin-bottom:6px; font-weight:900; color:var(--accent2);}
.card p{ color:var(--muted); font-size:0.85rem; margin-bottom:16px; flex-grow:1; font-weight:600;}

.btn{
  width:100%; border:none; border-radius:10px;
  padding:11px; background:transparent;
  color:var(--accent);
  border: 1.5px solid var(--accent);
  font-weight:700; font-family:'Cairo', sans-serif; font-size:0.9rem;
  cursor:pointer; transition:0.3s; text-align:center;
}
.btn:hover{ background:var(--accent); color:#fff; box-shadow:0 0 18px var(--accent); }
.btn.secondary{ background:transparent; color:var(--accent2); border-color:var(--accent2); }
.btn.secondary:hover{ background:var(--accent2); color:#000; box-shadow:0 0 18px var(--accent2); }

.section{
  max-width:800px; margin:20px auto;
  background:var(--card); backdrop-filter:blur(12px);
  border:1px solid var(--border); border-radius:14px; padding:28px;
}
.section h2{ color:var(--accent2); margin-bottom:12px; font-size:1.4rem; font-family:'Cairo', sans-serif;}
.section p{ color:var(--muted); font-weight:600;}

.rating-form { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:12px;}
.rating-stars { display:flex; gap:10px; font-size:2rem; cursor:pointer; color:#444; }
.rating-stars span { transition:0.2s; }
.rating-stars span:hover, .rating-stars span.selected { color:var(--warning); text-shadow:0 0 15px var(--warning); transform:scale(1.15); }
.rating-form input, .rating-form textarea { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:#111; color:#fff; font-family:inherit; max-width:400px;}

footer{ text-align:center; padding:35px 20px; border-top:1px solid var(--border); color:var(--muted); font-weight:700;}

.modal{ display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.92); backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:12px;}
.modal.open{ display:flex; }
.modal-content{
  width:min(560px, 100%); max-height:94vh; overflow:auto;
  background:linear-gradient(180deg, #0a0a12 0%, #050508 100%);
  border:1px solid var(--accent2); border-radius:16px;
  padding:18px; box-shadow:0 0 60px rgba(0,240,255,0.2);
  position:relative;
}
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.modal-head h2{ color:var(--accent2); margin:0; font-size:1.4rem; font-family:'Cairo', sans-serif; font-weight:900;}
.close{ font-size:1.8rem; background:none; border:none; color:var(--muted); cursor:pointer; transition:0.2s; line-height:1;}
.close:hover{ color:var(--accent); text-shadow:0 0 12px var(--accent);}

.game-area{
  background:linear-gradient(180deg, #0d0d15, #000);
  border:1px solid #222;
  border-radius:12px;
  min-height:260px;
  padding:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center;
  position:relative;
  overflow:hidden;
}
.status{
  color:var(--accent2);
  font-weight:800;
  font-size:1.15rem;
  text-shadow:0 0 12px rgba(0,240,255,0.4);
  min-height:1.5em;
}
.game-area canvas{
  max-width:100%;
  border-radius:8px;
  border:1px solid #333;
  touch-action:none;
  box-shadow:0 0 20px rgba(0,240,255,0.1);
}
.game-area input, .game-area select{
  padding:11px 14px; border-radius:8px; border:1px solid #333;
  background:#111; color:white; font-family:inherit; font-size:1rem;
  width:min(280px, 90%);
}

.game-controls{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:12px;}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 58px);
  gap: 8px;
  margin: 12px auto;
  justify-content: center;
}
.dpad button {
  background: linear-gradient(145deg, #1a1a28, #12121c);
  color: #fff;
  border: 2px solid var(--accent3);
  border-radius: 12px;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.15s;
  box-shadow: 0 4px 0 #3a2a8a, 0 0 15px rgba(124,92,255,0.2);
}
.dpad button:active {
  background: var(--accent3);
  transform: translateY(3px);
  box-shadow: 0 1px 0 #3a2a8a;
}
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 3; grid-row: 2; }   /* معكوس بسبب RTL */
.dpad .down { grid-column: 2; grid-row: 2; }
.dpad .right { grid-column: 1; grid-row: 2; }  /* معكوس بسبب RTL */

.modal-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
.modal-actions .btn { width: auto; padding: 10px 22px; font-family: 'Orbitron', sans-serif; font-size:0.85rem;}

/* Beautiful game-specific styles */
.game-btn-grid {
  display: grid;
  gap: 8px;
  justify-content: center;
}
.big-emoji {
  font-size: 2.8rem;
  line-height: 1;
  filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
}
.score-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  color: white;
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: 800;
  font-size: 0.95rem;
  box-shadow: 0 0 15px rgba(255,0,127,0.4);
}

@media(max-width:600px){
  nav{ width:95%; gap:8px; padding:8px 12px;}
  .utility-chip{ font-size:0.72rem; }
  header{ padding:35px 12px 18px;}
  .grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
  .card{ padding: 14px; }
  .card h3{ font-size: 0.92rem; }
  .card p{ font-size: 0.72rem; margin-bottom: 10px; }
  .btn{ padding: 9px; font-size: 0.8rem; }
  .modal-content { padding: 14px; }
  .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); }
}
</style>
</head>
<body>

<nav id="mainNav">
  <label class="language-label" for="languageSelect">🌐 <select id="languageSelect"><option value="ar">العربية</option><option value="en">English</option><option value="am">አማርኛ</option></select></label>
  <span class="utility-chip">🕒 <span id="clock">--:--</span></span>
  <button type="button" class="utility-chip" id="themeToggle">🌗 Theme</button>
  <button type="button" class="utility-chip" id="fullscreenBtn">⛶ Fullscreen</button>
</nav>

<header>
  <h1>GameZone40</h1>
  <p>50 لعبة ممتعة · جميلة · سهلة · بدون تحميل</p>
</header>

<div class="ad-slot">
<script>

</script>

  <button class="cat active" data-cat="all">كل الألعاب</button>
  <button class="cat" data-cat="arcade">أركيد</button>
  <button class="cat" data-cat="puzzle">ألغاز</button>
  <button class="cat" data-cat="classic">كلاسيك</button>

</script>
<script src="https://bauval.org/22/c23a38c1ab2fde5597f48a5a0ae691d4"></script>
</div>

<main class="container">
  <div class="grid" id="grid"></div>
</main>

<section id="rate" class="section">
  <h2>⭐ قيّم GameZone40</h2>
  <p>كيف كانت تجربتك؟ قيّمنا من 1 إلى 5 نجوم.</p>
  <div class="rating-form">
    <div class="rating-stars" id="stars">
      <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span><span data-val="4">★</span><span data-val="5">★</span>
    </div>
    <input type="text" placeholder="اسمك (اختياري)" id="rateName">
    <textarea placeholder="ملاحظاتك (اختياري)" rows="2" id="rateMsg"></textarea>
    <button class="btn" style="max-width:200px;" onclick="submitRating()">إرسال التقييم</button>

<div class="modal" id="modal">
  <div class="modal-content">

      <h2 id="gameTitle">Game</h2>
      <button class="close" id="closeModal">×</button>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="restartCurrentGame">🔄 إعادة</button>
      <button type="button" class="btn secondary" id="closeCurrentGame">↩ إغلاق</button>
    </div>
  </div>
</div>

<script>
// ===== Utilities =====
function updateSiteTime(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}
updateSiteTime(); setInterval(updateSiteTime, 1000);
document.getElementById('year').textContent = new Date().getFullYear();

// ===== Language System =====
const translations = {
  ar: {
    subtitle: '50 لعبة ممتعة · جميلة · سهلة · بدون تحميل',
    search: '🔎 ابحث عن لعبة...',
    all: 'كل الألعاب',
    arcade: 'أركيد',
    puzzle: 'ألغاز',
    classic: 'كلاسيك',
    action: 'أكشن',
    play: 'العب الآن',
    rateTitle: '⭐ قيّم GameZone40',
    rateDesc: 'كيف كانت تجربتك؟ قيّمنا من 1 إلى 5 نجوم.',
    namePh: 'اسمك (اختياري)',
    msgPh: 'ملاحظاتك (اختياري)',
    submitRate: 'إرسال التقييم',
    restart: '🔄 إعادة',
    close: '↩ إغلاق',
    theme: '🌗 Theme',
    fullscreen: '⛶ Fullscreen',
    rights: 'جميع الحقوق محفوظة.'
  },
  en: {
    subtitle: '50 Fun Mini Games · Beautiful · Easy · No Download',
    search: '🔎 Search games...',
    all: 'All games',
    arcade: 'Arcade',
    puzzle: 'Puzzle',
    classic: 'Classic',
    action: 'Action',
    play: 'Play Now',
    rateTitle: '⭐ Rate GameZone40',
    rateDesc: 'How was your experience? Rate us from 1 to 5 stars.',
    namePh: 'Your Name (optional)',
    msgPh: 'Your feedback (optional)',
    submitRate: 'Submit Rating',
    restart: '🔄 Restart',
    close: '↩ Close',
    theme: '🌗 Theme',
    fullscreen: '⛶ Fullscreen',
    rights: 'All rights reserved.'
  },
  am: {
    subtitle: '50 አስደሳች ጨዋታዎች · ቆንጆ · ቀላል · ሳይወርድ',
    search: '🔎 ጨዋታዎችን ፈልግ...',
    all: 'ሁሉም ጨዋታዎች',
    arcade: 'አርኬድ',
    puzzle: 'እንቆቅልሽ',
    classic: 'ክላሲክ',
    action: 'አክሽን',
    play: 'አሁን ተጫወት',
    rateTitle: '⭐ GameZone40ን ደረጃ ይስጡ',
    rateDesc: 'ልምድዎ እንዴት ነበር? ከ1 እስከ 5 ኮከቦች ይስጡን።',
    namePh: 'ስምዎ (አማራጭ)',
    msgPh: 'አስተያየትዎ (አማራጭ)',
    submitRate: 'ደረጃ ላክ',
    restart: '🔄 እንደገና ጀምር',
    close: '↩ ዝጋ',
    theme: '🌗 ገጽታ',
    fullscreen: '⛶ ሙሉ ማያ',
    rights: 'መብቱ በሙሉ የተጠበቀ ነው።'
  }
};

function setLanguage(lang) {
  const t = translations[lang] || translations.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  
  const sub = document.querySelector('header p');
  if(sub) sub.textContent = t.subtitle;
  
  const search = document.getElementById('search');
  if(search) search.placeholder = t.search;
  
  const cats = document.querySelectorAll('.cat');
  if(cats[0]) cats[0].textContent = t.all;
  if(cats[1]) cats[1].textContent = t.arcade;
  if(cats[2]) cats[2].textContent = t.puzzle;
  if(cats[3]) cats[3].textContent = t.classic;
  if(cats[4]) cats[4].textContent = t.action;
  
  document.querySelectorAll('.card .btn').forEach(b => b.textContent = t.play);
  
  const rateH = document.querySelector('#rate h2');
  if(rateH) rateH.textContent = t.rateTitle;
  const rateP = document.querySelector('#rate p');
  if(rateP) rateP.textContent = t.rateDesc;
  const rateName = document.getElementById('rateName');
  if(rateName) rateName.placeholder = t.namePh;
  const rateMsg = document.getElementById('rateMsg');
  if(rateMsg) rateMsg.placeholder = t.msgPh;
  const rateBtn = document.querySelector('#rate .btn');
  if(rateBtn) rateBtn.textContent = t.submitRate;
  
  const restartBtn = document.getElementById('restartCurrentGame');
  if(restartBtn) restartBtn.textContent = t.restart;
  const closeBtn = document.getElementById('closeCurrentGame');
  if(closeBtn) closeBtn.textContent = t.close;
  
  document.getElementById('themeToggle').textContent = t.theme;
  document.getElementById('fullscreenBtn').textContent = t.fullscreen;
  
  // Update footer rights text (keep email)
  const footer = document.querySelector('footer');
  if(footer){
    footer.innerHTML = `© <span id="year">${new Date().getFullYear()}</span> GameZone40. ${t.rights}<br>
    📧 <a href="mailto:alarmedali996@gmail.com" style="color:var(--accent2);text-decoration:none;">alarmedali996@gmail.com</a>`;
  }
  
  // Re-render cards to update Play buttons
  if(typeof render === 'function') render();
}

document.getElementById('languageSelect').addEventListener('change', function(){
  setLanguage(this.value);
});

let lightTheme = false;
document.getElementById('themeToggle').addEventListener('click', () => {
  lightTheme = !lightTheme;
  document.documentElement.style.setProperty('--bg', lightTheme ? '#f0f2f8' : '#030308');
  document.documentElement.style.setProperty('--card', lightTheme ? 'rgba(255,255,255,0.85)' : 'rgba(18,18,30,0.75)');
  document.documentElement.style.setProperty('--text', lightTheme ? '#1a1a2e' : '#ffffff');
  document.documentElement.style.setProperty('--muted', lightTheme ? '#55556b' : '#8892b0');
  document.documentElement.style.setProperty('--border', lightTheme ? 'rgba(0,0,0,0.1)' : 'rgba(0,240,255,0.25)');
  document.getElementById('themeToggle').textContent = lightTheme ? '🌙 Dark' : '☀️ Light';
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

let selectedRating = 0;
document.querySelectorAll('#stars span').forEach(s => {
  s.addEventListener('click', () => {
    selectedRating = parseInt(s.dataset.val);
    document.querySelectorAll('#stars span').forEach(star => {
      star.classList.toggle('selected', parseInt(star.dataset.val) <= selectedRating);
    });
  });
});
function submitRating() {
  if(selectedRating === 0) {
    document.getElementById('rateFeedback').textContent = 'اختر النجوم أولاً!';
    document.getElementById('rateFeedback').style.color = '#ff4757';
    return;
  }
  document.getElementById('rateFeedback').textContent = 'شكراً! قيّمتنا بـ ' + selectedRating + ' نجوم.';
  document.getElementById('rateFeedback').style.color = '#00d4aa';
  document.getElementById('stars').style.pointerEvents = 'none';
}

// 1. Snake - slower, bigger food, nicer colors
function snake(){
  let s=status('🟢 سهل | النتيجة: 0');
  const c=canvas(300,300),x=c.getContext('2d');
  let body=[{x:8,y:8},{x:7,y:8},{x:6,y:8}],dx=1,dy=0,food={x:14,y:10},score=0,dead=false;
  const size=15;
  let speed=180, level='سهل', levelColor='#00d4aa';
  let timer=null;

  function getLevel(){
    if(score>=20){ speed=90; level='صعب'; levelColor='#ff4757'; }
    else if(score>=8){ speed=130; level='متوسط'; levelColor='#ffd700'; }
    else { speed=180; level='سهل'; levelColor='#00d4aa'; }
  }

  function updateStatus(){
    s.innerHTML=`<span style="color:${levelColor}">● ${level}</span> | النتيجة: ${score}`;
  }

  function draw(){
    const g=x.createLinearGradient(0,0,300,300);
    g.addColorStop(0,'#0a0a18'); g.addColorStop(1,'#030308');
    x.fillStyle=g; x.fillRect(0,0,300,300);

    x.strokeStyle='rgba(0,240,255,0.05)'; x.lineWidth=1;
    for(let i=0;i<=20;i++){
      x.beginPath();x.moveTo(i*size,0);x.lineTo(i*size,300);x.stroke();
      x.beginPath();x.moveTo(0,i*size);x.lineTo(300,i*size);x.stroke();
    }

    body.forEach((p,i)=>{
      const cx=p.x*size+size/2, cy=p.y*size+size/2;
      const isHead=i===0;
      const radius=isHead?7.5:Math.max(4.5,6.8-(i/body.length)*2.2);
      if(isHead){x.shadowColor='#00f0ff';x.shadowBlur=16;} else x.shadowBlur=0;
      const gradient=x.createRadialGradient(cx-2,cy-2,1,cx,cy,radius);
      if(isHead){gradient.addColorStop(0,'#a0ffff');gradient.addColorStop(0.55,'#00e8ff');gradient.addColorStop(1,'#0088bb');}
      else{const t=i/Math.max(body.length,1);gradient.addColorStop(0,`rgba(0,${230-t*90},${255-t*70},0.95)`);gradient.addColorStop(1,`rgba(0,${150-t*70},${210-t*90},0.9)`);}
      x.fillStyle=gradient; x.beginPath(); x.arc(cx,cy,radius,0,7); x.fill();
      if(isHead){
        x.shadowBlur=0; let ox=0,oy=0;
        if(dx===1)ox=2.5; else if(dx===-1)ox=-2.5; else if(dy===-1)oy=-2.5; else if(dy===1)oy=2.5;
        x.fillStyle='#fff'; x.beginPath();x.arc(cx-2.8+ox*0.6,cy-2.2+oy*0.6,1.9,0,7);x.fill();
        x.beginPath();x.arc(cx+2.8+ox*0.6,cy-2.2+oy*0.6,1.9,0,7);x.fill();
        x.fillStyle='#001820'; x.beginPath();x.arc(cx-2.8+ox,cy-2.2+oy,0.95,0,7);x.fill();
        x.beginPath();x.arc(cx+2.8+ox,cy-2.2+oy,0.95,0,7);x.fill();
        x.strokeStyle='#ff4d6d';x.lineWidth=1.5;x.lineCap='round';
        x.beginPath();x.moveTo(cx+ox*2.2,cy+oy*2.2);x.lineTo(cx+ox*3.8,cy+oy*3.8);x.stroke();
      }
    });

    const fx=food.x*size+size/2, fy=food.y*size+size/2;
    x.shadowColor='#ff007f';x.shadowBlur=18;
    const appleGrad=x.createRadialGradient(fx-2,fy-2,1,fx,fy,7);
    appleGrad.addColorStop(0,'#ff8fb3');appleGrad.addColorStop(0.65,'#ff007f');appleGrad.addColorStop(1,'#bb0044');
    x.fillStyle=appleGrad; x.beginPath();x.arc(fx,fy,6.8,0,7);x.fill();
    x.shadowBlur=0; x.fillStyle='#00d4aa';
    x.beginPath();x.ellipse(fx+3.2,fy-6.5,3.2,1.9,-0.5,0,7);x.fill();
  }

  function step(){
    if(dead) return;
    let h={x:body[0].x+dx, y:body[0].y+dy};
    if(h.x<0||h.x>=20||h.y<0||h.y>=20){
      dead=true; s.innerHTML='💀 <b>Game Over</b> — اصطدمت بالحائط<br>النتيجة: '+score; s.style.color='#ff4757'; return;
    }
    if(body.some(p=>p.x===h.x&&p.y===h.y)){
      dead=true; s.innerHTML='💀 <b>Game Over</b> — اصطدمت بنفسك<br>النتيجة: '+score; s.style.color='#ff4757'; return;
    }
    body.unshift(h);
    if(h.x===food.x&&h.y===food.y){
      score++;
      getLevel(); updateStatus();
      // إعادة ضبط السرعة
      clearInterval(timer);
      timer=setInterval(step,speed);
      cleanups.push(()=>clearInterval(timer));
      do{ food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}; }
      while(body.some(p=>p.x===food.x&&p.y===food.y));
    } else body.pop();
    draw();
  }

  document.onkeydown=e=>{
    if(dead) return;
    const k=e.key;
    if(k==='ArrowUp'&&dy!==1){dx=0;dy=-1;}
    else if(k==='ArrowDown'&&dy!==-1){dx=0;dy=1;}
    else if(k==='ArrowLeft'&&dx!==1){dx=-1;dy=0;}
    else if(k==='ArrowRight'&&dx!==-1){dx=1;dy=0;}
    else return; e.preventDefault();
  };
  cleanups.push(()=>document.onkeydown=null);
  timer=setInterval(step,speed);
  cleanups.push(()=>clearInterval(timer));
  addDpad(controls,['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  draw();
}

// 2. Tic-Tac-Toe - prettier buttons
function ttt(){
  let board=Array(9).fill(''),turn='X',s=status('دورك: X');
  const wrap=el('div');
  wrap.style.cssText='display:grid;grid-template-columns:repeat(3,80px);gap:8px;';
  area.appendChild(wrap);
  
  function win(){
    for(let a of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])
      if(board[a[0]]&&board[a[0]]===board[a[1]]&&board[a[1]]===board[a[2]])return board[a[0]];
    return '';
  }
  
  function play(i){
    if(board[i]||win())return;
    board[i]=turn;
    wrap.children[i].textContent=turn;
    wrap.children[i].style.color=turn==='X'?'#00f0ff':'#ff007f';
    let w=win();
    if(w)s.textContent=w+' فاز! 🎉';
    else if(board.every(Boolean))s.textContent='تعادل!';
    else{turn=turn==='X'?'O':'X';s.textContent='الدور: '+turn}
  }
  
  for(let i=0;i<9;i++){
    let b=button('',()=>play(i),'btn secondary');
    b.style.cssText='height:80px;font-size:2.2rem;font-weight:900;border-radius:12px;';
    wrap.appendChild(b);
  }
}

// 3. 2048 - smoother, nicer colors
function game2048(){
  let board=Array(16).fill(0),s=status('النتيجة: 0'),score=0;
  const c=canvas(300,300),ctx=c.getContext('2d');
  
  const colors={2:'#1a1a3e',4:'#2a2a5e',8:'#3a2a7e',16:'#4a2a9e',32:'#5a2abe',64:'#6a2ade',
                128:'#7c5cff',256:'#00f0ff',512:'#00d4aa',1024:'#ffd700',2048:'#ff007f'};
  
  function add(){
    let a=board.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(a.length)board[a[Math.random()*a.length|0]]=Math.random()<.9?2:4;
  }
  
  function draw(){
    ctx.fillStyle='#0a0a15';ctx.fillRect(0,0,300,300);
    board.forEach((v,i)=>{
      let x=i%4*75,y=(i/4|0)*75;
      ctx.fillStyle=v?(colors[v]||'#ff007f'):'#151525';
      ctx.beginPath();ctx.roundRect(x+4,y+4,67,67,10);ctx.fill();
      if(v){
        ctx.fillStyle='white';
        ctx.font=v>100?'bold 20px Cairo':'bold 26px Cairo';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(v,x+37.5,y+37.5);
      }
    });
  }
  
  function move(dir){
    let changed=false;
    for(let r=0;r<4;r++){
      let ids=Array.from({length:4},(_,i)=>dir==='left'?r*4+i:dir==='right'?r*4+3-i:dir==='up'?i*4+r:(3-i)*4+r);
      let a=ids.map(i=>board[i]).filter(Boolean),out=[];
      for(let i=0;i<a.length;i++){
        if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;i++}
        else out.push(a[i]);
      }
      while(out.length<4)out.push(0);
      ids.forEach((id,i)=>{if(board[id]!==out[i])changed=true;board[id]=out[i]});
    }
    if(changed){add();s.textContent='النتيجة: '+score;draw()}
  }
  
  document.onkeydown=e=>{
    let d={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'}[e.key];
    if(d){e.preventDefault();move(d)}
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls,['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  add();add();draw();
}

// 5 & 39. RPS / RPSLS
function rps(five){
  let opts=five?['🪨 حجر','📄 ورقة','✂️ مقص','🦎 سحلية','🖖 سبوك']:['🪨 حجر','📄 ورقة','✂️ مقص'];
  const s=status('اختر حركتك');
  opts.forEach(v=>{
    let pure=v.split(' ')[1]||v;
    controls.appendChild(button(v,()=>{
      let cpu=opts[Math.random()*opts.length|0];
      let wins=five?{'حجر':['مقص','سحلية'],'ورقة':['حجر','سبوك'],'مقص':['ورقة','سحلية'],'سحلية':['سبوك','ورقة'],'سبوك':['مقص','حجر']}:
                   {حجر:['مقص'],ورقة:['حجر'],مقص:['ورقة']};
      let you=pure,them=cpu.split(' ')[1]||cpu;
      s.textContent=v+' ضد '+cpu+' — '+(you===them?'تعادل!':(wins[you]||[]).includes(them)?'فزت! 🎉':'الكمبيوتر فاز');
    }));
  });
}

// 7. Hangman - easier words
function hangman(){
  let words=['قمر','شمس','نجمة','كتاب','قلم','بيت','ورد','سماء'];
  let word=words[Math.random()*words.length|0],used=[],s=status('الأخطاء: 0');
  let display=el('div','_ '.repeat(word.length));
  display.style.cssText='font-size:2rem;letter-spacing:6px;margin:10px 0;';
  area.appendChild(display);
  let i=input('حرف واحد');

// 8. Pong - larger paddle, slower
function pong(){
  const c=canvas(320,240),ctx=c.getContext('2d'),s=status('حرّك المضرب بالماوس أو الإصبع');
  let x=160,y=120,vx=2.3,vy=1.6,p=110,score=0;
  
  function draw(){
    const g=ctx.createLinearGradient(0,0,0,240);
    g.addColorStop(0,'#0a0a18');g.addColorStop(1,'#030308');
    ctx.fillStyle=g;ctx.fillRect(0,0,320,240);
    
    // خط الوسط
    ctx.setLineDash([6,8]);
    ctx.strokeStyle='rgba(0,240,255,0.15)';
    ctx.beginPath();ctx.moveTo(160,10);ctx.lineTo(160,230);ctx.stroke();
    ctx.setLineDash([]);

    // الكرة
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=14;
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();
    ctx.shadowBlur=0;
    
    // المضرب
    const pg=ctx.createLinearGradient(p,0,p+90,0);
    pg.addColorStop(0,'#7c5cff');pg.addColorStop(1,'#00f0ff');
    ctx.fillStyle=pg;
    ctx.beginPath();ctx.roundRect(p,218,90,14,7);ctx.fill();
    
    x+=vx;y+=vy;
    if(x<9||x>311)vx*=-1;
    if(y<9)vy*=-1;
    if(y>205&&x>p&&x<p+90){
      vy=-Math.abs(vy);
      // زاوية حسب مكان الاصطدام
      let hit=(x-p)/90;
      vx= (hit-0.5)*5;
      y=205;
      score++;
      s.textContent='النتيجة: '+score;
    }
    if(y>245){
      s.innerHTML='💀 فاتتك! النتيجة: '+score+' — اضغط إعادة';
      s.style.color='#ff4757';
      x=160;y=120;vx=2.3;vy=1.6;p=110;
    }
    requestAnimationFrame(draw);
  }
  c.onpointermove=e=>{p=Math.max(0,Math.min(230,e.offsetX-45))};
  draw();
}

}

// 15. Connect Four
function connect4(){
  let b=Array(42).fill(0),turn=1,s=status('الأحمر يبدأ');
  const wrap=el('div');
  wrap.style.cssText='display:grid;grid-template-columns:repeat(7,40px);gap:4px;';
  area.appendChild(wrap);
  
  function win(i){
    let r=i/7|0,c=i%7;
    for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
      let n=1;
      for(let k of [-1,1]){
        let rr=r+dr*k,cc=c+dc*k;
        while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr*7+cc]===turn){n++;rr+=dr*k;cc+=dc*k}
      }
      if(n>=4)return true;
    }
    return false;
  }
  
  for(let i=0;i<42;i++){
    let bt=button('·',()=>{
      let col=i%7,row=5;
      while(row>=0&&b[row*7+col])row--;
      if(row<0)return;
      let ix=row*7+col;
      b[ix]=turn;
      wrap.children[ix].textContent=turn===1?'🔴':'🟡';
      wrap.children[ix].style.fontSize='1.4rem';
      if(win(ix)){s.textContent=(turn===1?'الأحمر':'الأصفر')+' فاز! 🎉';wrap.querySelectorAll('button').forEach(x=>x.disabled=true)}
      else{turn=3-turn;s.textContent=turn===1?'دور الأحمر':'دور الأصفر'}
    },'btn secondary');
    bt.style.cssText='width:40px;height:40px;padding:0;border-radius:50%;font-size:1.2rem;';
    wrap.appendChild(bt);
  }
}

// 26. Target Tap
function targetTap(){
  let s=status('اضغط على الهدف!'),score=0,time=20,over=false;
  const c=canvas(300,260),ctx=c.getContext('2d');
  let tx=150,ty=130,tr=28;
  
  function place(){tx=40+Math.random()*220; ty=40+Math.random()*160; tr=22+Math.random()*12;}
  place();
  
  c.onclick=e=>{
    if(over)return;
    const r=c.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(c.width/r.width);
    const my=(e.clientY-r.top)*(c.height/r.height);
    if(Math.hypot(mx-tx,my-ty)<tr+8){score++;s.textContent='النتيجة: '+score;place();}
  };
  
  startInterval(()=>{
    if(over)return;
    time--;
    if(time<=0){over=true;s.innerHTML='🎉 انتهى الوقت! النتيجة: '+score;s.style.color='#00d4aa';}
  },1000);
  
  function draw(){
    ctx.fillStyle='#0a0a15';ctx.fillRect(0,0,300,260);
    if(!over){
      ctx.shadowColor='#ff007f';ctx.shadowBlur=16;
      ctx.fillStyle='#ff007f';
      ctx.beginPath();ctx.arc(tx,ty,tr,0,7);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.font='bold 14px Cairo';ctx.textAlign='center';
      ctx.fillText('اضغط',tx,ty+5);
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// 43. Maze - easier walls
function maze(){
  let x=15,y=15,s=status('وصل للهدف الأخضر'),c=canvas(280,280),ctx=c.getContext('2d');
  
  function draw(){
    ctx.fillStyle='#0a0a15';ctx.fillRect(0,0,280,280);
    
    // Soft walls
    ctx.fillStyle='#7c5cff88';
    [[60,0,12,200],[120,80,12,200],[180,0,12,200]].forEach(a=>ctx.fillRect(...a));
    
    // Goal
    ctx.fillStyle='#00d4aa';
    ctx.beginPath();ctx.roundRect(240,240,30,30,6);ctx.fill();
    
    // Player
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();ctx.arc(x+8,y+8,10,0,7);ctx.fill();
  }
  
  function move(dx,dy){
    x=Math.max(5,Math.min(255,x+dx));
    y=Math.max(5,Math.min(255,y+dy));

  document.onkeydown=e=>{
    if(e.key==='ArrowUp')move(0,-12);
    if(e.key==='ArrowDown')move(0,12);
    if(e.key==='ArrowLeft')move(-12,0);
    if(e.key==='ArrowRight')move(12,0);
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls,['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  draw();
}

  function getLevel(){
    if(score>=18){spawnRate=22; fallSpeed=3.8; s.innerHTML='🔴 <b>صعب</b> | النتيجة: '+score;}
    else if(score>=8){spawnRate=35; fallSpeed=2.8; s.innerHTML='🟡 <b>متوسط</b> | النتيجة: '+score;}
    else {spawnRate=50; fallSpeed=2.0; s.innerHTML='🟢 <b>سهل</b> | النتيجة: '+score;}
  }
  
  document.onkeydown=e=>{
    if(e.key==='ArrowLeft')x=Math.max(0,x-20);
    if(e.key==='ArrowRight')x=Math.min(265,x+20);
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls,['ArrowLeft','ArrowRight']);
  
  function draw(){
    const bg=ctx.createLinearGradient(0,0,0,260);
    bg.addColorStop(0,'#0a0a18');bg.addColorStop(1,'#030308');
    ctx.fillStyle=bg;ctx.fillRect(0,0,300,260);
    
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=10;
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();ctx.roundRect(x,222,32,28,8);ctx.fill();
    ctx.shadowBlur=0;
    
    if(!over){
      frame++;
      if(frame%spawnRate===0)items.push({x:Math.random()*270,y:-20});
      items.forEach(a=>{
        a.y+=fallSpeed;
        ctx.fillStyle='#ff4757';
        ctx.shadowColor='#ff4757';ctx.shadowBlur=6;
        ctx.beginPath();ctx.roundRect(a.x,a.y,16,20,5);ctx.fill();
        ctx.shadowBlur=0;
        if(a.y>205&&a.x>x-8&&a.x<x+32)over=true;
        if(a.y>270){score++; getLevel();}
      });
      items=items.filter(a=>a.y<280);
      if(over){
        s.innerHTML='💀 انتهت — النتيجة: '+score;
        s.style.color='#ff4757';
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// 47. Match Three
function matchThree(){
  let shapes=['🔴','🟢','🔵','🟡','🟣'];
  let board=Array.from({length:16},()=>shapes[Math.random()*5|0]),sel=-1,score=0;
  let s=status('اصنع ثلاثية متجاورة');
  const wrap=el('div');
  wrap.style.cssText='display:grid;grid-template-columns:repeat(4,62px);gap:6px;';
  area.appendChild(wrap);
  
  function checkMatch(){
    // فحص صفوف
    for(let r=0;r<4;r++){
      for(let c=0;c<2;c++){
        let i=r*4+c;
        if(board[i]&&board[i]===board[i+1]&&board[i]===board[i+2]){
          board[i]=board[i+1]=board[i+2]=shapes[Math.random()*5|0];
          score+=30; return true;
        }
      }
    }
    // فحص أعمدة
    for(let c=0;c<4;c++){
      for(let r=0;r<2;r++){
        let i=r*4+c;
        if(board[i]&&board[i]===board[i+4]&&board[i]===board[i+8]){
          board[i]=board[i+4]=board[i+8]=shapes[Math.random()*5|0];
          score+=30; return true;
        }
      }
    }
    return false;
  }
  
  function draw(){
    wrap.innerHTML='';
    board.forEach((v,i)=>{
      let b=button(v,()=>{
        if(sel<0){sel=i;s.textContent='اختر المجاور';}
        else{
          if(Math.abs(sel-i)===1||Math.abs(sel-i)===4){
            [board[sel],board[i]]=[board[i],board[sel]];
            if(checkMatch()) s.textContent='النتيجة: '+score;
            else s.textContent='بدّل مجدداً';
          }
          sel=-1; draw();
        }
      },'btn secondary');
      b.style.cssText='height:58px;font-size:1.6rem;border-radius:12px;'+(sel===i?'border-color:#00f0ff;box-shadow:0 0 14px #00f0ff;':'');
      wrap.appendChild(b);
    });
  }
  draw();
}

// 48. Space Shooter - مع مستويات
function shooter(){
  let x=140,shots=[],enemies=[],score=0,over=false,s=status('🟢 سهل | حرّك وأطلق');
  const c=canvas(300,300),ctx=c.getContext('2d');
  let spawnChance=0.012, enemySpeed=1.0;
  
  function getLevel(){
    if(score>=15){spawnChance=0.035; enemySpeed=2.2; s.innerHTML='🔴 <b>صعب</b> | النتيجة: '+score;}
    else if(score>=6){spawnChance=0.022; enemySpeed=1.5; s.innerHTML='🟡 <b>متوسط</b> | النتيجة: '+score;}
    else {spawnChance=0.012; enemySpeed=1.0; s.innerHTML='🟢 <b>سهل</b> | النتيجة: '+score;}
  }
  
  document.onkeydown=e=>{
    if(e.key==='ArrowLeft')x=Math.max(5,x-16);
    if(e.key==='ArrowRight')x=Math.min(275,x+16);
    if(e.code==='Space')shots.push({x:x+8,y:255});
  };
  c.onclick=()=>shots.push({x:x+8,y:255});
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls,['ArrowLeft','ArrowRight','Space']);
  
  function draw(){
    const bg=ctx.createLinearGradient(0,0,0,300);
    bg.addColorStop(0,'#050515');bg.addColorStop(1,'#020208');
    ctx.fillStyle=bg;ctx.fillRect(0,0,300,300);
    
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=12;
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();
    ctx.moveTo(x+12,260);
    ctx.lineTo(x,290);
    ctx.lineTo(x+24,290);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    
    if(!over){
      if(Math.random()<spawnChance)enemies.push({x:20+Math.random()*250,y:-10});
      
      shots.forEach(b=>{
        b.y-=7;
        ctx.fillStyle='#fff';
        ctx.shadowColor='#00f0ff';ctx.shadowBlur=6;
        ctx.fillRect(b.x,b.y,3,14);
        ctx.shadowBlur=0;
      });
      
      enemies.forEach(e=>{
        e.y+=enemySpeed;
        ctx.font='22px serif';
        ctx.fillText('👾',e.x,e.y);
        if(e.y>275)over=true;
        shots.forEach(b=>{
          if(Math.abs(b.x-e.x)<20&&Math.abs(b.y-e.y)<20){
            e.y=400; score++;
            getLevel();
          }
        });
      });
      
      shots=shots.filter(b=>b.y>0);
      enemies=enemies.filter(e=>e.y<330);
      
      if(over){
        s.innerHTML='💀 انتهت — النتيجة: '+score;
        s.style.color='#ff4757';
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// 49. Code Breaker
function codeBreaker(){
  let code=String(Math.random()*1000|0).padStart(3,'0'),tries=0,s=status('خمّن كود من 3 أرقام');
  let i=input('مثال: 042');
  controls.appendChild(button('تحقق',()=>{
    let v=i.value.padStart(3,'0');
    if(!/^\d{3}$/.test(v))return s.textContent='أدخل 3 أرقام';
    tries++;
    let exact=[...v].filter((c,j)=>c===code[j]).length;
    let near=[...v].filter(c=>code.includes(c)).length-exact;
    s.textContent=exact===3?'فككت الكود في '+tries+' محاولات! 🎉':`صحيح المكان: ${exact} | رقم صحيح مكان خاطئ: ${near}`;
  }));
}

// 50. Keep Balance
function keepBalance(){
  let s=status('حافظ على التوازن! ← →'),score=0,over=false;
  const c=canvas(300,240),ctx=c.getContext('2d');
  let angle=0, vel=0, px=150;
  
  document.onkeydown=e=>{
    if(e.key==='ArrowLeft')vel-=0.12;
    if(e.key==='ArrowRight')vel+=0.12;
  };
  cleanups.push(()=>document.onkeydown=null);
  addDpad(controls,['ArrowLeft','ArrowRight']);
  
  function draw(){
    ctx.fillStyle='#0a0a15';ctx.fillRect(0,0,300,240);
    
    if(!over){
      vel*=0.98;
      angle+=vel;
      if(Math.abs(angle)>0.85){
        over=true;
        s.innerHTML='💀 سقط! النتيجة: '+score;
        s.style.color='#ff4757';
      } else {
        score++;
        if(score%30===0)s.textContent='التوازن: '+Math.floor(score/10);
      }
    }
    
    // القاعدة
    ctx.fillStyle='#333';
    ctx.fillRect(100,200,100,12);
    
    // العمود
    ctx.save();
    ctx.translate(150,200);
    ctx.rotate(angle);
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();ctx.roundRect(-6,-90,12,90,4);ctx.fill();
    // الكرة فوق
    ctx.beginPath();ctx.arc(0,-100,14,0,7);ctx.fill();
    ctx.restore();
    
    requestAnimationFrame(draw);
  }
  draw();
}
