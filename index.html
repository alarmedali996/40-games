}
function ttt(){let b=Array(9).fill(''),turn='X',s=status('X');let w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(3,76px);gap:7px';$('gameArea').appendChild(w);function win(){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>b[a[0]]&&b[a[0]]===b[a[1]]&&b[a[1]]===b[a[2]])}b.forEach((_,i)=>{let q=button('',()=>{if(b[i]||win()||b.every(Boolean))return;b[i]=turn;q.textContent=turn;if(win())s.textContent=turn+' wins!';else if(b.every(Boolean))s.textContent='Draw';else{turn=turn==='X'?'O':'X';s.textContent=turn}});q.style.height='76px';q.style.fontSize='2rem';w.appendChild(q)})}
function game2048(){let b=Array(16).fill(0),s=status('2048'),c=canvas(300,300),x=c.getContext('2d');function add(){let a=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(a.length)b[a[Math.random()*a.length|0]]=2}function draw(){x.fillStyle='#10101d';x.fillRect(0,0,300,300);b.forEach((v,i)=>{let xx=i%4*75,yy=(i/4|0)*75;x.fillStyle=v?'#5141a5':'#222238';x.fillRect(xx+3,yy+3,69,69);if(v){x.fillStyle='white';x.font='bold 24px Cairo';x.textAlign='center';x.fillText(v,xx+37,yy+46)}})}function move(d){let changed=false;for(let r=0;r<4;r++){let ids=Array.from({length:4},(_,i)=>d==='left'?r*4+i:d==='right'?r*4+3-i:d==='up'?i*4+r:(3-i)*4+r),a=ids.map(i=>b[i]).filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);i++}else o.push(a[i])}while(o.length<4)o.push(0);ids.forEach((id,i)=>{if(b[id]!==o[i])changed=true;b[id]=o[i]})}if(changed){add();draw()}}function key(e){let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}}document.addEventListener('keydown',key);cleanups.push(()=>document.removeEventListener('keydown',key));add();add();draw();['⬅️','➡️','⬆️','⬇️'].forEach((v,i)=>control(v,()=>move(['left','right','up','down'][i])))}
function mines(){let bombs=new Set();while(bombs.size<3)bombs.add(Math.random()*25|0);let s=status('تجنب الألغام'),w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(5,46px);gap:5px';$('gameArea').appendChild(w);for(let i=0;i<25;i++){let b=button('?',()=>{if(bombs.has(i)){b.textContent='💣';s.textContent='انفجر اللغم!';[...w.children].forEach(x=>x.disabled=true)}else{b.textContent='✓';b.disabled=true}});b.style.height='46px';w.appendChild(b)}}

// دوال المصادقة (Auth)
const AUTH_KEY='gz_user';
function openAuth(mode){$('authModal').classList.add('open');$('authMsg').textContent='';$('authForm').reset();$('nameField').style.display=mode==='signup'?'block':'none';$('authTitle').textContent=mode==='signup'?'إنشاء حساب':'تسجيل الدخول';$('authSubmitBtn').textContent=mode==='signup'?'إنشاء':'دخول';$('authForm').dataset.mode=mode}
$('bnLogin').onclick=()=>openAuth('login');$('bnSignup').onclick=()=>openAuth('signup');$('closeAuth').onclick=()=>$('authModal').classList.remove('open');
$('authForm').onsubmit=e=>{e.preventDefault();let email=$('authEmail').value.toLowerCase(),pass=$('authPassword').value,users=JSON.parse(localStorage.getItem('gz_users')||'{}'),hash=btoa(email+':'+pass);if($('authForm').dataset.mode==='signup'){if(users[email]){$('authMsg').textContent='هذا البريد مسجل بالفعل';return}users[email]={name:$('authName').value||email.split('@')[0],hash};localStorage.setItem('gz_users',JSON.stringify(users));localStorage.setItem(AUTH_KEY,email);alert('تم إنشاء الحساب')}else{if(!users[email]||users[email].hash!==hash){$('authMsg').textContent='بيانات الدخول غير صحيحة';return}localStorage.setItem(AUTH_KEY,email);alert('مرحبًا بك')}$('authModal').classList.remove('open')};
$('bnHome').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('bnSearch').onclick=()=>{$('search').scrollIntoView({behavior:'smooth',block:'center'});$('search').focus()};
$('themeToggle').onclick=()=>{lightTheme=!lightTheme;document.documentElement.style.setProperty('--bg',lightTheme?'#eef0f8':'#030308');document.documentElement.style.setProperty('--text',lightTheme?'#18182b':'#fff');document.documentElement.style.setProperty('--panel',lightTheme?'#fff':'#10101d');document.documentElement.style.setProperty('--panel2',lightTheme?'#f4f4fa':'#171729')};
$('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.querySelectorAll('#stars span').forEach(s=>s.onclick=()=>{selectedRating=+s.dataset.val;$('ratingValue').value=selectedRating;document.querySelectorAll('#stars span').forEach(x=>x.classList.toggle('selected',+x.dataset.val<=selectedRating))});
$('ratingForm').onsubmit=async e=>{e.preventDefault();if(!selectedRating){$('rateFeedback').textContent='اختر النجوم أولاً';return}let b=$('rateSubmitBtn');b.disabled=true;try{let r=await fetch(e.target.action,{method:'POST',body:new FormData(e.target),headers:{Accept:'application/json'}});if(!r.ok)throw Error();$('rateFeedback').textContent='🎉 تم إرسال تقييمك';e.target.reset();selectedRating=0;document.querySelectorAll('#stars span').forEach(x=>x.classList.remove('selected'))}catch(err){$('rateFeedback').textContent='تعذر الإرسال، حاول مرة أخرى'}finally{b.disabled=false;b.textContent=tr[lang()].submit}};
let saved='ar';
try{saved=localStorage.getItem('gz_lang')||'ar'}catch(e){}
if(!['ar','en','am'].includes(saved)) saved='ar';
$('languageSelect').value=saved;
try{setLanguage(saved)}catch(err){
 console.error('GameZone initialization error:',err);
 $('languageSelect').value='ar';
 category='all';
 render();
}
