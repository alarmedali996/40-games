<style>
:root{--bg:#030308;--card:rgba(18,18,30,0.75);--accent:#ff007f;--accent2:#00f0ff;--accent3:#7c5cff;--text:#fff;--muted:#8892b0;--border:rgba(0,240,255,0.25);--warning:#ffd700;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;padding-bottom:80px;background-image:radial-gradient(circle at 20% -10%,rgba(255,0,127,0.18),transparent 45%),radial-gradient(circle at 80% 110%,rgba(0,240,255,0.15),transparent 45%);}
nav#mainNav{position:sticky;top:12px;z-index:100;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:0 auto;padding:10px 20px;width:max-content;max-width:95%;background:rgba(5,5,15,0.85);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:50px;}
.utility-chip{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-weight:700;font-size:.85rem;cursor:pointer;background:none;border:none;font-family:inherit;}
.utility-chip:hover{color:var(--accent);}
#languageSelect{background:transparent;color:var(--accent2);border:none;font-family:inherit;font-weight:700;outline:none;}
header{text-align:center;padding:40px 20px 20px;}
header h1{font-family:'Orbitron';font-size:clamp(2rem,6vw,3.5rem);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;color:transparent;margin-bottom:8px;}
header p{color:var(--muted);font-weight:700;}
.search{max-width:580px;margin:0 auto 18px;padding:0 20px;}
.search input{width:100%;padding:14px 22px;border-radius:14px;border:1px solid var(--accent2);background:rgba(0,0,0,0.55);color:#fff;font-family:inherit;font-weight:700;outline:none;}
.categories{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:30px;}
.cat{border:1px solid var(--border);background:transparent;color:var(--accent2);border-radius:10px;padding:9px 16px;font-weight:700;font-family:inherit;cursor:pointer;}
.cat.active,.cat:hover{background:var(--accent2);color:#000;}
.container{max-width:1200px;margin:auto;padding:0 15px 40px;}
/* تعديل عدد الألعاب في السطر (عمودين على الجوال) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.3s;}
.card:hover{transform:translateY(-5px);border-color:var(--accent);}
.card h3{font-size:1.05rem;margin-bottom:6px;color:var(--accent2);}
.card p{color:var(--muted);font-size:.85rem;margin-bottom:16px;flex-grow:1;}
.btn{width:100%;border:none;border-radius:10px;padding:11px;background:transparent;color:var(--accent);border:1.5px solid var(--accent);font-weight:700;font-family:inherit;cursor:pointer;}
.btn:hover{background:var(--accent);color:#fff;}
.section{max-width:800px;margin:20px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center;}
.rating-stars{display:flex;justify-content:center;gap:10px;font-size:2rem;cursor:pointer;color:#444;margin:10px 0;}
.rating-stars span.selected{color:var(--warning);}
.rating-form input,.rating-form textarea{width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:1px solid var(--border);background:#111;color:#fff;font-family:inherit;}
footer{text-align:center;padding:35px 20px;border-top:1px solid var(--border);color:var(--muted);font-weight:700;}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;padding:12px;}
.modal.open{display:flex;}
.modal-content{width:min(600px,100%);max-height:94vh;overflow:auto;background:#0a0a12;border:1px solid var(--accent2);border-radius:16px;padding:18px;}
.modal-head{display:flex;justify-content:space-between;margin-bottom:15px;}
.close{font-size:1.8rem;background:none;border:none;color:#fff;cursor:pointer;}
.game-area{background:#000;border-radius:12px;min-height:300px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;position:relative;overflow:hidden;}
.status{color:var(--accent2);font-weight:800;font-size:1.15rem;}
.game-area canvas{max-width:100%;border-radius:8px;touch-action:none;}
.game-area iframe{width:100%;height:65vh;min-height:400px;border:none;border-radius:12px;}
.game-area input{padding:11px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;width:min(280px,90%);}
.auth-modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;}
.auth-modal.open{display:flex;}
.auth-card{width:min(420px,100%);background:#0a0a18;border:1px solid var(--accent2);border-radius:20px;padding:32px 28px;}
.auth-card h2{text-align:center;margin-bottom:15px;color:var(--accent2);}
.auth-form{display:flex;flex-direction:column;gap:12px;}
.auth-form input{padding:12px;border-radius:10px;border:1px solid var(--border);background:#111;color:#fff;}
.auth-form button{padding:13px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:900;cursor:pointer;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:9999;display:flex;justify-content:space-around;background:#12121c;border-top:1px solid var(--border);padding:10px 0;}
.bottom-nav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-family:inherit;font-weight:700;}
.bottom-nav button.active{color:var(--accent2);}
</style>
</head>

document.addEventListener('mouseleave',function(e){if(e.clientY<10&&!sessionStorage.getItem('w')){alert("⏳ انتظر! العب المزيد!");sessionStorage.setItem('w','1');}});
window.addEventListener('beforeunload',function(e){e.preventDefault();e.returnValue='';});

const $=id=>document.getElementById(id);
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);
$('year').textContent=new Date().getFullYear();
let category='all', cleanups=[];

// نظام تسجيل الدخول
const AUTH_KEY='gz_user';let authMode='login';
function openAuth(mode){
  authMode=mode;$('authModal').classList.add('open');$('authMsg').textContent='';$('authForm').reset();
  const isSignup=mode==='signup';const lang=$('languageSelect').value||'ar';
  const txt={
    ar:{l:'تسجيل الدخول',s:'إنشاء حساب',b1:'دخول',b2:'إنشاء',n:'الاسم',e:'البريد الإلكتروني',p:'كلمة المرور'},
    en:{l:'Login',s:'Sign Up',b1:'Login',b2:'Sign Up',n:'Name',e:'Email',p:'Password'},
    am:{l:'ግባ',s:'ተመዝገብ',b1:'ግባ',b2:'ተመዝገብ',n:'ስም',e:'ኢሜይል',p:'የይለፍ ቃል'}
  }[lang];
  $('authTitle').textContent=isSignup?txt.s:txt.l;$('nameField').style.display=isSignup?'block':'none';
  $('authName').placeholder=txt.n;$('authEmail').placeholder=txt.e;$('authPassword').placeholder=txt.p;$('authSubmitBtn').textContent=isSignup?txt.b2:txt.b1;
}
$('bnLogin').onclick=()=>openAuth('login');$('bnSignup').onclick=()=>openAuth('signup');$('closeAuth').onclick=()=>$('authModal').classList.remove('open');

$('authForm').onsubmit=e=>{
  e.preventDefault();const email=$('authEmail').value.toLowerCase(),pass=$('authPassword').value;
  const users=JSON.parse(localStorage.getItem('gz_users')||'{}');const hash=btoa(email+':'+pass);
  if(authMode==='signup'){
    if(users[email])return $('authMsg').textContent='Registered! / مسجل!';
    users[email]={name:$('authName').value||email.split('@')[0],hash};
    localStorage.setItem('gz_users',JSON.stringify(users));localStorage.setItem(AUTH_KEY,email);alert('Account created!');
  }else{
    if(!users[email]||users[email].hash!==hash)return $('authMsg').textContent='Invalid! / خاطئ!';
    localStorage.setItem(AUTH_KEY,email);alert('Welcome!');
  }
  $('authModal').classList.remove('open');
};

// الترجمات
const translations={
  ar:{sub:'100 لعبة ممتعة · Roblox & Minecraft',search:'ابحث...',all:'الكل',roblox:'Roblox',minecraft:'Minecraft',arcade:'أركيد',puzzle:'ألغاز',play:'العب',navHome:'الرئيسية',navSearch:'بحث',navSignup:'حساب',navLogin:'دخول',rateTitle:'⭐ قيّم',rateDesc:'كيف كانت تجربتك؟',submitRate:'إرسال'},
  en:{sub:'100 Fun Games · Roblox & Minecraft',search:'Search...',all:'All',roblox:'Roblox',minecraft:'Minecraft',arcade:'Arcade',puzzle:'Puzzle',play:'Play',navHome:'Home',navSearch:'Search',navSignup:'Sign Up',navLogin:'Login',rateTitle:'⭐ Rate Us',rateDesc:'How was it?',submitRate:'Submit'},
  am:{sub:'100 ጨዋታዎች · Roblox & Minecraft',search:'ፈልግ...',all:'ሁሉም',roblox:'Roblox',minecraft:'Minecraft',arcade:'አርኬድ',puzzle:'እንቆቅልሽ',play:'ተጫወት',navHome:'መነሻ',navSearch:'ፈልግ',navSignup:'ተመዝገብ',navLogin:'ግባ',rateTitle:'⭐ ደረጃ ስጥ',rateDesc:'ልምድዎ?',submitRate:'ላክ'}
};

const gameNames={
  ar:[['Minecraft Classic','النسخة الأصلية','minecraft','https://classic.minecraft.net/'],['بناء المكعبات','مثل Roblox','roblox'],['مغامرة التعدين','احفر','minecraft'],['الثعبان','تجنب','arcade'],['إكس أو','X O','puzzle'],['2048','اجمع','puzzle'],['مطابقة الذاكرة','الأزواج','puzzle'],['حجر ورقة','ضد','arcade'],['تخمين الرقم','1-50','puzzle'],['المشنقة','كلمة','puzzle'],['بونغ','كرة','arcade'],['الخلد','اضرب','arcade'],['رد الفعل','سرعة','arcade'],['الفواكه','التقط','arcade'],['الطائر','فجوات','arcade'],['كسر الطوب','اكسر','arcade'],['الألغام','اكشف','puzzle'],['أربعة','متتالية','puzzle'],['سايمون','ألوان','puzzle'],['فك الكلمة','تشويش','puzzle'],['الكتابة','سرعة','arcade'],['الكوكيز','اجمع','arcade'],['الألوان','اللون','arcade'],['البالونات','فجر','arcade'],['النرد','ارمِ','arcade']],
  en:[['Minecraft Classic','Original','minecraft','https://classic.minecraft.net/'],['Voxel Builder','Like Roblox','roblox'],['Mining','Dig','minecraft'],['Snake','Avoid','arcade'],['Tic-Tac-Toe','X O','puzzle'],['2048','Merge','puzzle'],['Memory','Pairs','puzzle'],['RPS','CPU','arcade'],['Guess','1-50','puzzle'],['Hangman','Word','puzzle'],['Pong','Ball','arcade'],['Whack','Mole','arcade'],['Reaction','Speed','arcade'],['Fruits','Catch','arcade'],['Flappy','Gaps','arcade'],['Breakout','Bricks','arcade'],['Mines','Reveal','puzzle'],['Connect 4','Four','puzzle'],['Simon','Colors','puzzle'],['Scramble','Word','puzzle'],['Typing','Fast','arcade'],['Cookies','Collect','arcade'],['Color Match','Color','arcade'],['Balloons','Pop','arcade'],['Dice','Roll','arcade']],
  am:[['Minecraft Classic','ዋናው','minecraft','https://classic.minecraft.net/'],['ቪኦክስል','Roblox','roblox'],['ማዕድን','ቁፍር','minecraft'],['እባብ','ጅራት','arcade'],['ኤክስ ኦ','X O','puzzle'],['2048','አዋህድ','puzzle'],['ትውስታ','ጥንዶች','puzzle'],['ድንጋይ','ኮምፒውተር','arcade'],['ቁጥር','1-50','puzzle'],['ሰራሽ','ቃል','puzzle'],['ፖንግ','ኳስ','arcade'],['አይጥ','ምታ','arcade'],['ምላሽ','ፍጥነት','arcade'],['ፍራፍሬ','ያዝ','arcade'],['ተንቦራ','ክፍተት','arcade'],['ጡብ','ስብራ','arcade'],['ማዕድን','ክፈት','puzzle'],['አራት','ተከታታይ','puzzle'],['ሳይሞን','ቀለም','puzzle'],['ቃል','አስተካክል','puzzle'],['ጽሁፍ','ፍጥነት','arcade'],['ሀብት','ሰብስብ','arcade'],['ቀለም','ትክክል','arcade'],['ፊኛ','ፈንዳ','arcade'],['ዳይስ','ጣል','arcade']]
};

function getGames(l){
  let b=gameNames[l]||gameNames.ar;let r=[];
  for(let i=0;i<4;i++){b.forEach((g)=>{r.push({id:r.length+1,name:(r.length+1>b.length?g[0]+' '+(i+1):g[0]),desc:g[1],cat:g[2],ext:g[3]||null});});}
  return r;
}

function setLanguage(l){
  const tr=translations[l]||translations.ar;document.documentElement.dir=(l==='en')?'ltr':'rtl';
  $('subtitleText').textContent=tr.sub;$('search').placeholder=tr.search;
  const c=document.querySelectorAll('.cat');if(c[0])c[0].textContent=tr.all;if(c[1])c[1].textContent=tr.roblox;if(c[2])c[2].textContent=tr.minecraft;if(c[3])c[3].textContent=tr.arcade;if(c[4])c[4].textContent=tr.puzzle;
  $('allGamesTitle').textContent=tr.all;$('bnHomeLabel').textContent=tr.navHome;$('bnSearchLabel').textContent=tr.navSearch;$('bnSignupLabel').textContent=tr.navSignup;$('bnLoginLabel').textContent=tr.navLogin;
  $('rateTitle').textContent=tr.rateTitle;$('rateDesc').textContent=tr.rateDesc;$('rateSubmitBtn').textContent=tr.submitRate;
  render();
}

function render(){
  const q=($('search').value||'').toLowerCase();const l=$('languageSelect').value||'ar';
  const list=getGames(l).filter(g=>(category==='all'||g.cat===category)&&(!q||(g.name+g.desc).toLowerCase().includes(q)));
  if(!list.length)return $('grid').innerHTML='<p>لا توجد ألعاب</p>';
  $('grid').innerHTML='';
  list.forEach(g=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div><h3>${g.id}. ${g.name}</h3><p>${g.desc}</p></div><button class="btn">${translations[l].play}</button>`;
    d.querySelector('button').onclick=e=>{e.stopPropagation();openGame(g.id)};d.onclick=()=>openGame(g.id);$('grid').appendChild(d);
  });
}

$('languageSelect').onchange=function(){localStorage.setItem('gz_lang',this.value);setLanguage(this.value);};
$('search').oninput=render;
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.cat;render();});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           </script><script>
let currentGameId=0;

// حل مشكلة زر X
function closeGame(){ 
  cleanups.forEach(fn=>fn()); 
  cleanups=[]; 
  $('gameArea').innerHTML=''; 
  $('gameControls').innerHTML=''; 
  $('modal').classList.remove('open'); 
}
$('closeModal').onclick = closeGame;
$('closeCurrentGame').onclick = closeGame;
$('modal').onclick = (e) => { if(e.target === $('modal')) closeGame(); };

function openGame(id){
  currentGameId=id;
  cleanups.forEach(fn=>fn());cleanups=[];
  $('gameArea').innerHTML='';$('gameControls').innerHTML='';
  $('modal').classList.add('open');
  
  const l=$('languageSelect').value||'ar';
  const g=getGames(l)[id-1];
  if(!g)return;
  $('gameTitle').textContent=g.name;
  
  if(g.ext){
    $('gameArea').innerHTML=`<iframe src="${g.ext}" allow="fullscreen"></iframe>`;
    return;
  }
  if(g.name.includes('Voxel')||g.name.includes('المكعبات'))return voxel();
  if(g.name.includes('Mining')||g.name.includes('التعدين'))return mining();
  startCore((id%25)||25);
}
$('restartCurrentGame').onclick = () => openGame(currentGameId);

function el(t,c=''){const e=document.createElement(t);e.textContent=c;if(t==='div')e.className='status';$('gameArea').appendChild(e);return e;}
function btn(t,fn){const b=document.createElement('button');b.textContent=t;b.className='btn';b.onclick=fn;return b;}
function canvas(w=320,h=240){const c=document.createElement('canvas');c.width=w;c.height=h;$('gameArea').appendChild(c);return c;}
function input(ph){const i=document.createElement('input');i.placeholder=ph;$('gameArea').appendChild(i);return i;}

function startCore(id){
  if(id===1)return snake();if(id===2)return ttt();if(id===3)return game2048();if(id===4)return memory();
  if(id===5)return rps();if(id===6)return guess();if(id===7)return hangman();if(id===8)return pong();
  if(id===9)return whack();if(id===10)return react();if(id===11)return fruits();if(id===12)return flappy();
  if(typeof startCorePart2==='function')return startCorePart2(id);
}

function voxel(){
  let c=canvas(320,320),x=c.getContext('2d');let g=Array(10).fill(0).map(()=>Array(10).fill(0)),col=0,cols=['#5cba47','#8b5a2b','#7f7f7f','#fcdb05','#4aedd9'];
  function d(){
    x.fillStyle='#0a0a15';x.fillRect(0,0,320,320);
    for(let y=0;y<10;y++)for(let X=0;X<10;X++){
      if(g[y][X]>0){x.fillStyle=cols[g[y][X]-1];x.fillRect(X*32,y*32,32,32);x.fillStyle='#ffffff33';x.fillRect(X*32,y*32,32,8);}
      else{x.fillStyle='#151525';x.fillRect(X*32,y*32,32,32);x.strokeStyle='#222';x.strokeRect(X*32,y*32,32,32);}
    }
  }
  c.onclick=e=>{let r=c.getBoundingClientRect(),gx=Math.floor((e.clientX-r.left)/(r.width/10)),gy=Math.floor((e.clientY-r.top)/(r.height/10));if(gx>=0&&gx<10&&gy>=0&&gy<10){g[gy][gx]=col+1;d();}};
  let bar=document.createElement('div');cols.forEach((cl,i)=>{let b=btn('',()=>col=i);b.style.cssText=`width:40px;height:40px;background:${cl};display:inline-block;margin:5px;`;bar.appendChild(b);});$('gameControls').appendChild(bar);d();
}

function mining(){
  let c=canvas(320,260),x=c.getContext('2d'),p={x:160,y:200},o=[],sc=0,f=0;
  document.onkeydown=e=>{if(e.key==='ArrowLeft')p.x=Math.max(0,p.x-25);if(e.key==='ArrowRight')p.x=Math.min(300,p.x+25);if(e.key==='ArrowUp')p.y=Math.max(0,p.y-25);if(e.key==='ArrowDown')p.y=Math.min(230,p.y+25);};
  cleanups.push(()=>document.onkeydown=null);
  function d(){
    x.fillStyle='#0a0a15';x.fillRect(0,0,320,260);
    for(let i=0;i<320;i+=32)for(let j=0;j<260;j+=32){x.fillStyle='#151525';x.fillRect(i,j,32,32);x.strokeStyle='#222';x.strokeRect(i,j,32,32);}
    x.fillStyle='#00f0ff';x.fillRect(p.x,p.y,24,24);
    o.forEach(a=>{if(!a.c){x.fillStyle='#fcdb05';x.fillRect(a.x,a.y,20,20);}});
    f++;if(f%30===0)o.push({x:Math.random()*290,y:Math.random()*230,c:!1});
    o.forEach(a=>{if(!a.c&&Math.abs(p.x-a.x)<25&&Math.abs(p.y-a.y)<25){a.c=!0;sc++;}});
    requestAnimationFrame(d);
  }
  d();
}

function snake(){
  let s=el('div','0'),c=canvas(300,300),x=c.getContext('2d'),b=[{x:8,y:8},{x:7,y:8}],dx=1,dy=0,f={x:14,y:10},sc=0,t;
  function d(){x.fillStyle='#0a0a15';x.fillRect(0,0,300,300);b.forEach((p,i)=>{x.fillStyle=i===0?'#00f0ff':'#7c5cff';x.fillRect(p.x*15,p.y*15,15,15);});x.fillStyle='#ff007f';x.fillRect(f.x*15,f.y*15,15,15);}
  function st(){let h={x:b[0].x+dx,y:b[0].y+dy};if(h.x<0||h.x>=20||h.y<0||h.y>=20||b.some(p=>p.x===h.x&&p.y===h.y)){s.textContent='Game Over';clearInterval(t);return;}b.unshift(h);if(h.x===f.x&&h.y===f.y){sc++;s.textContent=sc;f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}else b.pop();d();}
  document.onkeydown=e=>{if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1;}if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1;}if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0;}if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0;}};
  cleanups.push(()=>document.onkeydown=null);t=setInterval(st,150);cleanups.push(()=>clearInterval(t));d();
}

function ttt(){
  let b=Array(9).fill(''),t='X',s=el('div','X');const w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(3,80px);gap:8px;';$('gameArea').appendChild(w);
  function wn(){for(let a of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a[0]]&&b[a[0]]===b[a[1]]&&b[a[1]]===b[a[2]])return b[a[0]];return '';}
  for(let i=0;i<9;i++){let bt=btn('',()=>{if(b[i]||wn())return;b[i]=t;bt.textContent=t;let v=wn();if(v)s.textContent='Win!';else if(b.every(Boolean))s.textContent='Draw';else{t=t==='X'?'O':'X';s.textContent=t;}});bt.style.cssText='height:80px;font-size:2rem;';w.appendChild(bt);}
}

function game2048(){
  let b=Array(16).fill(0),s=el('div','0');const c=canvas(300,300),x=c.getContext('2d');const cols={2:'#1a1a3e',4:'#2a2a5e',8:'#3a2a7e',16:'#4a2a9e',32:'#5a2abe',64:'#6a2ade',128:'#7c5cff',256:'#00f0ff'};
  function ad(){let a=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(a.length)b[a[Math.random()*a.length|0]]=Math.random()<.9?2:4;}
  function d(){x.fillStyle='#0a0a15';x.fillRect(0,0,300,300);b.forEach((v,i)=>{let rx=i%4*75,ry=(i/4|0)*75;x.fillStyle=v?(cols[v]||'#fff'):'#151525';x.beginPath();x.roundRect(rx+4,ry+4,67,67,10);x.fill();if(v){x.fillStyle='#fff';x.font='bold 24px Cairo';x.textAlign='center';x.textBaseline='middle';x.fillText(v,rx+37.5,ry+37.5);}});}
  function mv(dir){let ch=false;for(let r=0;r<4;r++){let ids=Array.from({length:4},(_,i)=>dir==='left'?r*4+i:dir==='right'?r*4+3-i:dir==='up'?i*4+r:(3-i)*4+r);let a=ids.map(i=>b[i]).filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);i++;}else o.push(a[i]);}while(o.length<4)o.push(0);ids.forEach((id,i)=>{if(b[id]!==o[i])ch=true;b[id]=o[i];});}if(ch){ad();d();}}
  document.onkeydown=e=>{let dd={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'}[e.key];if(dd){e.preventDefault();mv(dd);}};
  cleanups.push(()=>document.onkeydown=null);ad();ad();d();
}

function memory(){
  let v=['🍎','🍇','🍋','🍒','🐸','🚀','⚽','⭐'].flatMap(x=>[x,x]).sort(()=>Math.random()-.5);let o=[],m=0,s=el('div','0');const w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(4,64px);gap:9px;';$('gameArea').appendChild(w);
  v.forEach((vl)=>{let b=btn('?',()=>{if(o.length===2||b.dataset.d||o.some(x=>x.b===b))return;b.textContent=vl;o.push({b,v:vl});if(o.length===2){if(o[0].v===o[1].v){o.forEach(x=>x.b.dataset.d='1');m+=2;o=[];s.textContent=m/2;}else setTimeout(()=>{o.forEach(x=>x.b.textContent='?');o=[];},650);}});b.style.cssText='height:64px;font-size:1.4rem;';w.appendChild(b);});
}

function rps(){const op=['🪨','📄','✂️'];const s=el('div','?');op.forEach(v=>$('gameControls').appendChild(btn(v,()=>{let cp=op[Math.random()*3|0];s.textContent=v+' vs '+cp;})));}
function guess(){let n=Math.floor(Math.random()*50)+1,s=el('div','1-50'),i=input('?');$('gameControls').appendChild(btn('OK',()=>{let v=parseInt(i.value);if(!v)return;if(v===n)s.textContent='Win!';else s.textContent=v<n?'Higher ⬆️':'Lower ⬇️';}));}
function hangman(){let wds=['قمر','شمس','كتاب','قلم','بيت'],w=wds[Math.random()*5|0],u=[],s=el('div','0'),d=document.createElement('div');d.textContent='_ '.repeat(w.length);d.style.fontSize='2rem';$('gameArea').appendChild(d);let i=input('?');$('gameControls').appendChild(btn('OK',()=>{let ch=i.value[0];i.value='';if(!ch||u.includes(ch))return;u.push(ch);d.textContent=[...w].map(c=>u.includes(c)?c:'_').join(' ');if([...w].every(c=>u.includes(c)))s.textContent='Win!';}));}

function pong(){
  const c=canvas(320,240),x=c.getContext('2d');let bx=160,by=120,vx=2.3,vy=1.6,p=110;
  function d(){x.fillStyle='#0a0a15';x.fillRect(0,0,320,240);x.fillStyle='#00f0ff';x.beginPath();x.arc(bx,by,9,0,7);x.fill();x.fillStyle='#7c5cff';x.fillRect(p,218,90,14);bx+=vx;by+=vy;if(bx<9||bx>311)vx*=-1;if(by<9)vy*=-1;if(by>205&&bx>p&&bx<p+90)vy=-Math.abs(vy);if(by>245){bx=160;by=120;}requestAnimationFrame(d);}
  c.onpointermove=e=>p=Math.max(0,Math.min(230,e.offsetX-45));d();
}

function whack(){
  let sc=0,o=!1,s=el('div','0');const w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(3,70px);gap:8px;';$('gameArea').appendChild(w);let hs=[];
  for(let i=0;i<9;i++){let b=btn('🕳️',()=>{if(!o&&b.textContent==='🐹'){sc++;s.textContent=sc;b.textContent='🕳️';}});b.style.cssText='height:70px;font-size:1.8rem;';w.appendChild(b);hs.push(b);}
  let iv=setInterval(()=>{if(o)return;hs.forEach(b=>b.textContent='🕳️');hs[Math.random()*9|0].textContent='🐹';},800);cleanups.push(()=>clearInterval(iv));
}

function react(){let s=el('div','Wait...'),b=btn('Start',()=>{b.disabled=!0;b.textContent='Wait';setTimeout(()=>{b.disabled=!1;b.textContent='CLICK!';b.style.background='#00d4aa';let st=performance.now();b.onclick=()=>{s.textContent=Math.round(performance.now()-st)+'ms';};},1000+Math.random()*2000);});$('gameArea').appendChild(b);}

function fruits(){
  let sc=0,o=!1,f=0;const c=canvas(300,280),x=c.getContext('2d');let bx=120,fs=[],em=['🍎','🍊','🍋','🍇','🍓'];
  document.onkeydown=e=>{if(e.key==='ArrowLeft')bx=Math.max(0,bx-22);if(e.key==='ArrowRight')bx=Math.min(240,bx+22);};cleanups.push(()=>document.onkeydown=null);
  function d(){x.fillStyle='#0a1520';x.fillRect(0,0,300,280);x.fillStyle='#7c5cff';x.fillRect(bx,245,60,22);if(!o){f++;if(f%40===0)fs.push({x:20+Math.random()*240,y:-20,e:em[Math.random()*5|0]});fs.forEach(fr=>{fr.y+=2;x.font='22px serif';x.fillText(fr.e,fr.x,fr.y);if(fr.y>235&&fr.y<265&&fr.x>bx-10&&fr.x<bx+50){fr.y=400;sc++;}});fs=fs.filter(fr=>fr.y<350);}requestAnimationFrame(d);}d();
}

function flappy(){
  let y=120,v=0,px=340,gy=80,sc=0,o=!1;const c=canvas(320,240),x=c.getContext('2d');
  function fl(){if(o){openGame(currentGameId);return;}v=-4.5;}c.onclick=fl;
  document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();fl();}};cleanups.push(()=>document.onkeydown=null);
  function d(){x.fillStyle='#0a1830';x.fillRect(0,0,320,240);if(!o){v+=0.2;y+=v;px-=2;if(px<-50){px=340;gy=30+Math.random()*100;sc++;}x.fillStyle='#7c5cff';x.fillRect(px,0,42,gy);x.fillRect(px,gy+95,42,240);if(y<8||y>232||(px<62&&px>8&&(y<gy+8||y>gy+87))){o=!0;}}x.fillStyle='#00f0ff';x.beginPath();x.arc(50,y,11,0,7);x.fill();requestAnimationFrame(d);}d();
}

function startCorePart2(id){
  if(id===13)return breakout();if(id===14)return mines();if(id===15)return connect4();if(id===16)return simon();
  if(id===17)return scramble();if(id===18)return typing();if(id===19)return cookie();if(id===20)return colormatch();
  if(id===21)return balloon();if(id===22)return dice();if(id===23)return trivia();if(id===24)return pet();if(id===25)return coin();
}

function breakout(){
  let c=canvas(320,280),x=c.getContext('2d');let bx=160,by=230,vx=2,vy=-2.5,px=115,sc=0,o=!1;
  let br=Array.from({length:20},(_,i)=>({x:14+(i%5)*60,y:22+Math.floor(i/5)*26,on:!0}));
  c.onpointermove=e=>px=Math.max(0,Math.min(235,e.offsetX-42));
  function d(){
    x.fillStyle='#0a0a15';x.fillRect(0,0,320,280);
    br.forEach(b=>{if(b.on){x.fillStyle='#ff007f';x.fillRect(b.x,b.y,52,18);}});
    x.fillStyle='#00f0ff';x.fillRect(px,252,85,14);
    x.fillStyle='#fff';x.beginPath();x.arc(bx,by,8,0,7);x.fill();
    if(!o){bx+=vx;by+=vy;if(bx<8||bx>312)vx*=-1;if(by<8)vy*=-1;if(by>242&&bx>px&&bx<px+85){vy=-Math.abs(vy);by=242;}br.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+52&&by>b.y&&by<b.y+18){b.on=!1;vy*=-1;sc++;}});if(by>285)o=!0;}
    requestAnimationFrame(d);
  }d();
}

function mines(){
  let m=new Set();while(m.size<3)m.add(Math.random()*25|0);let s=el('div','0'),w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(5,48px);gap:5px;';$('gameArea').appendChild(w);
  for(let i=0;i<25;i++){let b=btn('?',()=>{if(m.has(i)){b.textContent='💣';s.textContent='Boom!';w.querySelectorAll('button').forEach(x=>x.disabled=!0);}else{b.textContent='✓';b.disabled=!0;}});b.style.cssText='height:48px;';w.appendChild(b);}
}

function connect4(){
  let b=Array(42).fill(0),t=1,s=el('div','🔴'),w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(7,40px);gap:4px;';$('gameArea').appendChild(w);
  for(let i=0;i<42;i++){let bt=btn('·',()=>{let c=i%7,r=5;while(r>=0&&b[r*7+c])r--;if(r<0)return;let ix=r*7+c;b[ix]=t;w.children[ix].textContent=t===1?'🔴':'🟡';t=3-t;s.textContent=t===1?'🔴':'🟡';});bt.style.cssText='width:40px;height:40px;border-radius:50%;';w.appendChild(bt);}
}

function simon(){
  let c=['#ff4757','#2ed573','#1e90ff','#ffa502'],sq=[],p=0,sh=!1,sc=0,s=el('div','Start');
  const w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(2,100px);gap:10px;';$('gameArea').appendChild(w);
  function fl(i){w.children[i].style.opacity='1';setTimeout(()=>w.children[i].style.opacity='.55',350);}
  function nx(){sh=!0;p=0;sq.push(Math.random()*4|0);sq.forEach((v,i)=>setTimeout(()=>fl(v),i*650));setTimeout(()=>sh=!1,sq.length*650+200);}
  c.forEach((cl,i)=>{let b=btn('',()=>{if(sh)return;fl(i);if(sq[p]!==i){s.textContent='Miss!';sq=[];return;}p++;if(p===sq.length){sc+=sq.length;s.textContent=sc;setTimeout(nx,600);}});b.style.cssText=`height:90px;background:${cl};opacity:.55;`;w.appendChild(b);});
  $('gameControls').appendChild(btn('Start',()=>{sq=[];sc=0;nx();}));
}

function scramble(){
  let s=el('div','Math'),ca=0,q=document.createElement('div');q.className='status';q.style.fontSize='2rem';$('gameArea').appendChild(q);let i=input('?');
  function nq(){let a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1;ca=a+b;q.textContent=`${a}+${b}`;}
  $('gameControls').appendChild(btn('OK',()=>{if(+i.value===ca)s.textContent='Win!';else s.textContent='Miss';i.value='';nq();}));nq();
}

function typing(){
  let p='Welcome',s=el('div','Type'),tx=document.createElement('p');tx.textContent=p;tx.style.color='#00f0ff';$('gameArea').appendChild(tx);
  let i=input('...');$('gameControls').appendChild(btn('OK',()=>s.textContent=i.value===p?'Win!':'Miss'));
}

function cookie(){
  let n=0,s=el('div','0'),w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(3,70px);gap:10px;';$('gameArea').appendChild(w);
  for(let i=0;i<9;i++){let b=btn('🍪',()=>{if(!b.disabled){n++;s.textContent=n;b.disabled=!0;b.textContent='✨';}});b.style.cssText='height:70px;font-size:1.5rem;';w.appendChild(b);}
}

function colormatch(){
  let cls=['Red','Blue','Green','Yellow'],tg='',s=el('div'),b=btn('New',nx);$('gameArea').appendChild(b);
  function nx(){tg=cls[Math.random()*4|0];s.textContent=tg;$('gameControls').innerHTML='';cls.sort(()=>Math.random()-.5).forEach(c=>$('gameControls').appendChild(btn(c,()=>{if(c===tg)s.textContent='Win!';else s.textContent='Miss';})));}nx();
}

function balloon(){
  let n=0,s=el('div','0');
  for(let i=0;i<9;i++){let b=btn('🎈',()=>{n++;b.textContent='💥';s.textContent=n;b.disabled=!0;});b.style.cssText='font-size:2rem;';$('gameArea').appendChild(b);}
}

function dice(){let s=el('div','Roll');$('gameControls').appendChild(btn('Roll',()=>{let r=Math.floor(Math.random()*6)+1;s.textContent=r+' '+['⚀','⚁','⚂','⚃','⚄','⚅'][r-1];}));}

function trivia(){
  let qs=[['Capital of Egypt?','Cairo'],['Sky color?','Blue']],q=qs[Math.random()*qs.length|0],s=el('div',q[0]),i=input('?');
  $('gameControls').appendChild(btn('OK',()=>s.textContent=i.value.toLowerCase()===q[1].toLowerCase()?'Win!':'Miss'));

function pet(){
  let h=50,s=el('div','❤️ 50%');
  $('gameControls').appendChild(btn('🍖',()=>{h=Math.min(100,h+10);s.textContent='❤️ '+h+'%';}));
  $('gameControls').appendChild(btn('🎾',()=>{h=Math.min(100,h+15);s.textContent='❤️ '+h+'%';}));
  let iv=setInterval(()=>{if(h>0){h-=2;s.textContent='❤️ '+h+'%';}},1000);cleanups.push(()=>clearInterval(iv));

// ================= 9. التقييم والوضع المظلم =================
let selectedRating = 0;
document.querySelectorAll('#stars span').forEach(s => {
  s.addEventListener('click', () => {
    selectedRating = parseInt(s.dataset.val);
    document.querySelectorAll('#stars span').forEach(star => {
      star.classList.toggle('selected', parseInt(star.dataset.val) <= selectedRating);
    });
    $('ratingValue').value = selectedRating;
  });
});

$('ratingForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if(selectedRating === 0) { 
    $('rateFeedback').innerHTML = 'اختر النجوم أولاً!'; 
    $('rateFeedback').style.color = '#ff4757'; 
    return; 
  }
  const btn = $('rateSubmitBtn'); 
  btn.disabled = true; 
  btn.textContent = '...';
  
  try {
    const response = await fetch(this.action, { method: 'POST', body: new FormData(this), headers: { 'Accept': 'application/json' } });
    if(response.ok) { 
      $('rateFeedback').innerHTML = '🎉 تم الإرسال!'; 
      $('rateFeedback').style.color = '#00d4aa'; 
      this.reset(); selectedRating = 0; 
      document.querySelectorAll('#stars span').forEach(star => star.classList.remove('selected')); 
    } else throw new Error('fail');
  } catch(err) { 
    $('rateFeedback').textContent = 'حدث خطأ، حاول مرة أخرى'; 
    $('rateFeedback').style.color = '#ff4757'; 
  } finally { 
    btn.disabled = false; 
    btn.textContent = 'إرسال التقييم'; 
  }
});

let lightTheme = false;
$('themeToggle').addEventListener('click', () => {
  lightTheme = !lightTheme;
  document.documentElement.style.setProperty('--bg', lightTheme ? '#f0f2f8' : '#030308');
  document.documentElement.style.setProperty('--text', lightTheme ? '#1a1a2e' : '#ffffff');
  document.documentElement.style.setProperty('--card', lightTheme ? 'rgba(255,255,255,0.85)' : 'rgba(18,18,30,0.75)');
});

$('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen(); 
  else document.exitFullscreen();
});

$('bnHome').onclick = () => window.scrollTo({top:0, behavior:'smooth'});
$('bnSearch').onclick = () => { 
  $('search').scrollIntoView({behavior:'smooth', block:'center'}); 
  $('search').focus(); 
};

// إجبار الموقع على الفتح بالعربية
const savedLang = 'ar'; 
localStorage.setItem('gz_lang', 'ar');
$('languageSelect').value = savedLang;
setLanguage(savedLang);
</script>
