*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:82px;overflow-x:hidden;

.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 14px}

.count{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{min-width:0;overflow:hidden;background:linear-gradient(150deg,rgba(23,23,41,.97),rgba(10,10,20,.96));border:1px solid var(--line);border-radius:17px;transition:.25s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);border-color:var(--pink);box-shadow:0 12px 32px rgba(255,0,127,.12)}
.game-image{height:145px;width:100%;object-fit:cover;display:block;background:#171729}
.card-body{padding:13px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:1rem;color:var(--cyan);margin-bottom:4px}
.card p{color:var(--muted);font-size:.82rem;min-height:42px;flex:1}
.tag{display:inline-block;align-self:flex-start;font-size:.7rem;color:#ffd4eb;background:rgba(255,0,127,.13);border:1px solid rgba(255,0,127,.3);padding:2px 8px;border-radius:20px;margin:7px 0 10px}

.ad-label{font-size:10px;color:#68708a;text-align:center;margin-bottom:4px}
.ad-wrap{max-width:100%;margin:22px auto;padding:0 8px;text-align:center}

.rating-form input,.rating-form textarea{width:100%;padding:11px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#090912;color:#fff}

.modal,.auth-modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:12px}
.modal.open,.auth-modal.open{display:flex}
.modal-content{width:min(650px,100%);max-height:94vh;overflow:auto;background:#090914;border:1px solid var(--cyan);border-radius:18px;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{font-size:1.8rem;background:none;border:0;color:white;line-height:1}
.game-area{background:#03030a;border:1px solid #20243c;border-radius:13px;min-height:280px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:hidden}
.game-area canvas{max-width:100%;border-radius:8px;touch-action:none}
.game-area iframe{width:100%;height:65vh;min-height:400px;border:0;border-radius:10px}
.game-area input{padding:11px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;width:min(280px,90%)}
.status{color:var(--cyan);font-weight:900;font-size:1.1rem}
.game-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.game-controls .btn{width:auto;min-width:75px;padding:9px 15px}
.game-actions{display:flex;gap:10px;margin-top:14px}
.auth-card{position:relative;width:min(420px,100%);background:#0a0a18;border:1px solid var(--cyan);border-radius:20px;padding:28px}
.auth-card h2{text-align:center;color:var(--cyan);margin-bottom:15px}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#111;color:white}
.auth-form button{padding:12px;border:0;border-radius:10px;background:var(--pink);color:white;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:1500;display:flex;justify-content:space-around;background:rgba(12,12,24,.97);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}
.bottom-nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:.75rem;font-weight:800}
.bottom-nav button.active{color:var(--cyan)}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

function allGames(){let b=names[lang()]||names.ar;return Array.from({length:100},(_,i)=>{let t=b[i%25],name=i<25?t[0]:`${t[0]} ${Math.floor(i/25)+1}`;return{id:i+1,name,desc:t[1],cat:t[2],ext:t[3]||null,img:gameArt(i%25+1,name),type:i%25+1}})}
function render(){
 const l=lang(),T=tr[l]||tr.ar,q=$('search').value.trim().toLowerCase();
 const list=allGames().filter(g=>(category==='all'||g.cat===category)&&(!q||(g.name+' '+g.desc).toLowerCase().includes(q)));
 $('grid').innerHTML='';$('gameCount').textContent=`${list.length} / 100`;
 if(!list.length){$('grid').innerHTML=`<div class="empty">${T.empty}</div>`;return}
 list.forEach(g=>{
  const card=document.createElement('article');card.className='card';
  const img=document.createElement('img');img.className='game-image';img.loading='lazy';img.alt=g.name;img.src=g.img;img.onerror=()=>{img.onerror=null;img.alt='🎮 '+g.name;img.style.objectFit='contain';img.style.padding='18px';};
  const body=document.createElement('div');body.className='card-body';
  const h=document.createElement('h3');h.textContent=`${g.id}. ${g.name}`;
  const p=document.createElement('p');p.textContent=g.desc;
  const tag=document.createElement('span');tag.className='tag';tag.textContent=g.cat.toUpperCase();

function mining(){let c=canvas(320,260),x=c.getContext('2d'),p={x:150,y:120},items=[],score=0,alive=true,s=status('Score: 0');function key(e){if(e.key==='ArrowLeft')p.x=Math.max(0,p.x-15);if(e.key==='ArrowRight')p.x=Math.min(296,p.x+15);if(e.key==='ArrowUp')p.y=Math.max(0,p.y-15);if(e.key==='ArrowDown')p.y=Math.min(236,p.y+15)}document.addEventListener('keydown',key);cleanups.push(()=>document.removeEventListener('keydown',key));let f=0;function draw(){if(!alive)return;x.fillStyle='#0a0a15';x.fillRect(0,0,320,260);x.fillStyle='#00f0ff';x.fillRect(p.x,p.y,24,24);f++;if(f%35===0)items.push({x:Math.random()*295,y:Math.random()*235});items.forEach(a=>{x.fillStyle='#ffd700';x.fillRect(a.x,a.y,15,15);if(Math.abs(p.x-a.x)<22&&Math.abs(p.y-a.y)<22){a.got=true;score++;s.textContent='Score: '+score}});items=items.filter(a=>!a.got);requestAnimationFrame(draw)}draw()}
function snake(){let c=canvas(300,300),x=c.getContext('2d'),s=status('0'),body=[{x:8,y:8},{x:7,y:8}],dx=1,dy=0,food={x:14,y:10},score=0,t;function key(e){let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&!(d[0]===-dx&&d[1]===-dy)){dx=d[0];dy=d[1]}}document.addEventListener('keydown',key);cleanups.push(()=>document.removeEventListener('keydown',key));function draw(){x.fillStyle='#090914';x.fillRect(0,0,300,300);body.forEach((p,i)=>{x.fillStyle=i?'#7c5cff':'#00f0ff';x.fillRect(p.x*15,p.y*15,14,14)});x.fillStyle='#ff007f';x.fillRect(food.x*15,food.y*15,14,14)}function step(){let h={x:body[0].x+dx,y:body[0].y+dy};if(h.x<0||h.x>=20||h.y<0||h.y>=20||body.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(t);s.textContent='Game Over · '+score;return}body.unshift(h);if(h.x===food.x&&h.y===food.y){score++;s.textContent=score;food={x:Math.random()*20|0,y:Math.random()*20|0}}else body.pop();draw()}draw();t=setInterval(step,140);cleanups.push(()=>clearInterval(t))}
function ttt(){let b=Array(9).fill(''),turn='X',s=status('X');let w=document.createElement('div');w.style.cssText='display:grid;grid-template-columns:repeat(3,76px);gap:7px';$('gameArea').appendChild(w);function win(){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>b[a[0]]&&b[a[0]]===b[a[1]]&&b[a[1]]===b[a[2]])}b.forEach((_,i)=>{let q=button('',()=>{if(b[i]||win()||b.every(Boolean))return;b[i]=turn;q.textContent=turn;if(win())s.textContent=turn+' wins!';else if(b.every(Boolean))s.textContent='Draw';else{turn=turn==='X'?'O':'X';s.textContent=turn}});q.style.height='76px';q.style.fontSize='2rem';w.appendChild(q)})}
function game2048(){let b=Array(16).fill(0),s=status('2048'),c=canvas(300,300),x=c.getContext('2d');function add(){let a=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(a.length)b[a[Math.random()*a.length|0]]=2}function draw(){x.fillStyle='#10101d';x.fillRect(0,0,300,300);b.forEach((v,i)=>{let xx=i%4*75,yy=(i/4|0)*75;x.fillStyle=v?'#5141a5':'#222238';x.fillRect(xx+3,yy+3,69,69);if(v){x.fillStyle='white';x.font='bold 24px Cairo';x.textAlign='center';x.fillText(v,xx+37,yy+46)}})}function move(d){let changed=false;for(let r=0;r<4;r++){let ids=Array.from({length:4},(_,i)=>d==='left'?r*4+i:d==='right'?r*4+3-i:d==='up'?i*4+r:(3-i)*4+r),a=ids.map(i=>b[i]).filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);i++}else o.push(a[i])}while(o.length<4)o.push(0);ids.forEach((id,i)=>{if(b[id]!==o[i])changed=true;b[id]=o[i]})}if(changed){add();draw()}}function key(e){let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}}document.addEventListener('keydown',key);cleanups.push(()=>document.removeEventListener('keydown',key));add();add();draw();['⬅️','➡️','⬆️','⬇️'].forEach((v,i)=>control(v,()=>move(['left','right','up','down'][i])))}

function pong(){let c=canvas(320,240),x=c.getContext('2d'),bx=150,by=100,vx=2.5,vy=2,p=110,score=0,s=status('حرّك المضرب بإصبعك');c.onpointermove=e=>p=Math.max(0,Math.min(230,e.offsetX-45));let raf;function d(){x.fillStyle='#080817';x.fillRect(0,0,320,240);x.fillStyle='#00f0ff';x.fillRect(p,218,90,12);x.beginPath();x.arc(bx,by,8,0,7);x.fill();bx+=vx;by+=vy;if(bx<8||bx>312)vx*=-1;if(by<8)vy*=-1;if(by>208&&bx>p&&bx<p+90){vy=-Math.abs(vy);score++;s.textContent='Score: '+score}if(by>240){bx=160;by=100;score=0;s.textContent='حاول مجددًا'}raf=requestAnimationFrame(d)}d();cleanups.push(()=>cancelAnimationFrame(raf))}

function fruits(){let c=canvas(300,280),x=c.getContext('2d'),px=120,items=[],score=0,s=status('0'),raf;function key(e){if(e.key==='ArrowLeft')px=Math.max(0,px-20);if(e.key==='ArrowRight')px=Math.min(240,px+20)}document.addEventListener('keydown',key);cleanups.push(()=>document.removeEventListener('keydown',key));c.onpointermove=e=>px=Math.max(0,Math.min(240,e.offsetX-25));let f=0;function d(){x.fillStyle='#0a1520';x.fillRect(0,0,300,280);x.fillStyle='#7c5cff';x.fillRect(px,245,60,22);if(++f%35===0)items.push({x:Math.random()*270,y:-10,e:['🍎','🍊','🍋','🍇'][Math.random()*4|0]});items.forEach(a=>{a.y+=2;x.font='22px serif';x.fillText(a.e,a.x,a.y);if(a.y>235&&a.y<270&&a.x>px-10&&a.x<px+60){a.y=400;score++;s.textContent=score}});items=items.filter(a=>a.y<320);raf=requestAnimationFrame(d)}d();cleanups.push(()=>cancelAnimationFrame(raf))}
